<!doctype html><html lang="ja" data-human-motion-ready><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>人体の動き・土台</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e5df;color:#242a30;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:18px 22px 10px;max-width:900px;margin:auto}h1{font-size:21px;margin:0 0 6px}p{margin:5px 0;line-height:1.6;color:#515962}main{max-width:900px;margin:auto;padding:0 16px 24px}.board{position:relative;background:#f9f8f5;border:1px solid #d2cfc8;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:min(70vh,650px);touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}button{border:1px solid #b8bec4;background:white;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}.key{font-size:13px}.blue{color:#3377bc}.red{color:#d25654}.note{background:#fff5e4;border-radius:8px;padding:10px 14px;font-size:13px}</style></head><body><header><h1>人体の動き｜体と関節の土台</h1><p>丸い関節をドラッグして、ポーズを動かせます。まずは正面から見た簡単なモデルです。</p></header><main><div class="board"><canvas id="c" aria-label="ドラッグして動かす人体モデル"></canvas></div><div class="controls"><button id="reset">最初の姿勢に戻す</button><span class="key"><span class="blue">青：体のかたまり</span>　<span class="red">赤：体の流れ</span></span></div><p class="note">試作段階：関節は簡略化しています。筋肉、重力、床の摩擦、空気抵抗、歩行や剣の動作はまだ再現していません。実際の人体の可動範囲を保証するものではありません。</p></main><script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');
const initial=[{id:'neck',p:null,x:0,y:-180},{id:'head',p:'neck',x:0,y:-230},{id:'pelvis',p:'neck',x:0,y:0},{id:'ls',p:'neck',x:-58,y:-159},{id:'le',p:'ls',x:-90,y:-86},{id:'lh',p:'le',x:-110,y:-17},{id:'rs',p:'neck',x:58,y:-159},{id:'re',p:'rs',x:90,y:-86},{id:'rh',p:'re',x:110,y:-17},{id:'lhip',p:'pelvis',x:-35,y:10},{id:'lk',p:'lhip',x:-37,y:104},{id:'lf',p:'lk',x:-40,y:196},{id:'rhip',p:'pelvis',x:35,y:10},{id:'rk',p:'rhip',x:37,y:104},{id:'rf',p:'rk',x:40,y:196}];
let nodes,drag=null,scale=1,ox=0,oy=0;function reset(){nodes=structuredClone(initial);draw()}const by=id=>nodes.find(n=>n.id===id);function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);scale=Math.min(r.width/420,r.height/530);ox=r.width/2;oy=r.height*.55;draw()}
function path(ids,color,width){ctx.beginPath();ids.forEach((id,i)=>{const n=by(id);i?ctx.lineTo(n.x,n.y):ctx.moveTo(n.x,n.y)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function circle(n,r,fill,stroke='#52606c',w=1.5){ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=w;ctx.strokeStyle=stroke;ctx.stroke()}
function draw(){if(!nodes)return;const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.strokeStyle='#d0d4d4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-170,208);ctx.lineTo(170,208);ctx.stroke();const limbs=[['ls','le','lh'],['rs','re','rh'],['lhip','lk','lf'],['rhip','rk','rf']];for(const a of limbs){path(a,'#58616a',24);path(a,'#fbfbfa',20)}path(['lf','lf'],'#d4d4d4',14);path(['rf','rf'],'#d4d4d4',14);ctx.beginPath();for(const [i,id] of ['ls','rs','rhip','lhip'].entries()){const n=by(id);i?ctx.lineTo(n.x,n.y):ctx.moveTo(n.x,n.y)}ctx.closePath();ctx.fillStyle='#fbfbfa';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#56606a';ctx.stroke();const l=by('ls'),rr=by('rs'),lh=by('lhip'),rh=by('rhip');ctx.strokeStyle='#4688c6';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse((l.x+rr.x)/2,(l.y+rr.y)/2+22,Math.max(12,Math.abs(rr.x-l.x)*.41),37,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse((lh.x+rh.x)/2,(lh.y+rh.y)/2-2,Math.max(12,Math.abs(rh.x-lh.x)*.50),18,0,0,Math.PI*2);ctx.stroke();circle(by('head'),25,'#fafaf9');path(['head','neck','pelvis'],'#db5552',3);for(const n of nodes)if(n.id!=='neck'&&n.id!=='pelvis')circle(n,5,'#fff','#3079b6',2);ctx.restore()}
function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}function descendants(id){let out=[];for(const n of nodes.filter(v=>v.p===id)){out.push(n,...descendants(n.id))}return out}
canvas.addEventListener('pointerdown',e=>{const p=coords(e);let best=null,dist=18;for(const n of nodes){if(n.id==='neck'||n.id==='pelvis')continue;const d=Math.hypot(p.x-n.x,p.y-n.y);if(d<dist){best=n;dist=d}}if(best){drag=best;canvas.setPointerCapture(e.pointerId);e.preventDefault()}});canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=coords(e),parent=by(drag.p);if(!parent)return;const old=Math.atan2(drag.y-parent.y,drag.x-parent.x),ang=Math.atan2(p.y-parent.y,p.x-parent.x),diff=ang-old,c=Math.cos(diff),s=Math.sin(diff);for(const n of [drag,...descendants(drag.id)]){const x=n.x-parent.x,y=n.y-parent.y;n.x=parent.x+x*c-y*s;n.y=parent.y+x*s+y*c}draw()});function end(){drag=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.querySelector('#reset').addEventListener('click',reset);window.addEventListener('resize',resize);reset();resize();window.humanDebug={getNodes:()=>structuredClone(nodes),reset};
</script></body></html>
