const C=[
["bm","ビジネスモデルとは？","持続的に「儲かる仕組み」。他社には出せない価値（Value）を顧客に届けるために作られた、その会社特有の仕組み"],
["bm","ビジネスモデルで大事なことは？","競合に対して「差別化優位性」の構造をつくり、さらにその優位性を持続させる仕掛けを作ること（すぐ真似されない工夫）"],
["bm","優位性を持続させる仕掛け（5つ）","①早くつくり上げる ②常に刷新する ③ブランドを構築する ④人材を育てる ⑤特許技術による防衛"],
["bm","ビジネスシステムとは？","価値創造プロセス（価値を生み出して顧客に届けるまでの一連の仕組み）"],
["bm","ビジネスモデルの作り方（3ステップ）","①3Cに着目 ②ビジネスシステムを分析する ③エコノミクス（収益方程式）を設計する"],
["bm","3Cとは？","Customer（市場・顧客）、Competition（競合）、Company（自社）"],
["bm","収益方程式は？","利益（P）＝売上（V）－コスト（C）。売上（V）＝単価×個数"],
["bm","ビジネスシステムの小システムと大システム（レストランの例）","小システム：メニュー開発・仕入れ調達・価格設定・マーケティング・サービス／大システム：業態・用地買収・設備投資・許認可"],
["bm","ビジネスモデルの2類型（スライド）","①ローコスト型（お手軽に破格の安値を打ち出す）②価値創出型（全く新しいサービス・価値を提供する）"],
["bm","ローコスト型の例とキーワード","例：ビジネスホテル、LCC、コンビニ（vsスーパー）、カーシェア／キーワード：サービスの見直し、思い切った低価格、マニュアル化、省力化、チェーン展開"],
["bm","価値創出型の例とキーワード","例：ABCクッキング、AKB48、オフィスグリコ、宅配便／キーワード：今までにない新たなサービスの創出、従来の業界の枠を超える、新技術が契機の場合もある"],
["bm","ビジネスモデルの2つのタイプ（レジュメ）","（1）潜在ニーズの発掘（ビジネスになっていなかったニーズ）（2）古典的事業の刷新（古くからある事業の常識を壊す）"],
["bm","「潜在ニーズの発掘」の例","ダスキン（化学ぞうきん）、FedEx、PARK24（コインパーキング）、リクルート（高額不安型商品の仲介）、セコム（ガードマンの電子化）、アニコム（動物医療保険）、私鉄の沿線経営（阪急・東急）"],
["bm","「古典的事業の刷新」の例","QBハウス、東横イン、自転車のあさひ、アスクル（プラス）、宅配便（ヤマト、vs郵便小包）、LCC、ネスプレッソ、SFC"],
["bm","ビジネスモデルが陳腐化する理由（6つ）","①技術革新（ドラム式洗濯機、ハイブリッド車、デジタル家電）②業態開発（コンビニ、宅配便、ビジネスホテル、ファミレス）③普及・量産、過当競争 ④川上・川下の業界の構造変化（流通改革）⑤規制（強化・緩和）⑥代替サービス・商品（郵便とネット）"],
["bm","陳腐化に対する心構えは？","「いつでも崩壊する」という自覚と、たえまない刷新が必要。常に新たなチャンスを探る"],
["bm","ビジネスモデルを再構築する（作る）ポイント（4つ）","①新たな市場ニーズに着目（特に「問題解決」）②これまでの自社の強み・アセットを活かす ③競合より優位性のある商品・サービスを ④よそより早く提供し、先行者優位性を構築する"],
["bm","イノベーションとは？（レジュメ）","創造と工夫。ビジネスモデルが陳腐化すると必要になる"],
["bm","業態に関するキーワード","業態進化・業態開発・新業態（例：コンビニ、宅配便、ビジネスホテル、ファミレス）"],
["bm","まとめ：競争のカギは？","思い付くことよりも「持続させる仕組みづくり」。ビジネスモデルには寿命があり、再構築と刷新が必要"],
["bm","公共分野のビジネスモデル（ビジネスシステム）の例","東海道新幹線（vs在来線）、オリンピック、国民皆保険、代議制民主主義、国際郵便制度、NHK・民放、結婚式・お葬式、国連、国民国家など"],
["bm","オリンピックの元々のビジネスモデル（5要素）","①全競技・種目 ×②すべての国 ③同じ時期（4年毎・3週間）④1つの開催都市 ⑤スポンサー収入に依存。環境変化：テロ、パンデミック、IT革命、SDGs、招致への批判、開催都市の財政悪化"],
["bmc","QBハウスの特徴","10分（早い）・1400円（安い、創業時1000円）・駅ナカ/駅チカ（便利）。カットのみ、予約なし、先払い券売機。「10分の身だしなみ」"],
["bmc","QBハウスの収益モデル（従来の理髪店との違い）","QBハウス：低い客単価×高い回転率／従来：高い客単価（3500円程度）×低い回転率"],
["bmc","QBハウスの売上の分解","売上＝客数×客単価、客数＝席数×回転率×営業時間。1時間あたりのカット数を1回→6回に。価格は通常の1/3"],
["bmc","QBハウスのムダ削減","シャンプーなし（エアウォッシャー）→リクライニング椅子不要→店の面積縮小、床下吸引機、席ごとの滅菌器、券売機（会計の手間なし）、電話なし、グッズ販売なし、インテリア投資なし、本部がデータ分析"],
["bmc","QBハウスの人材への考え方","運営は極力効率化、人材育成・確保には投資。6か月の研修中も給料、復職すると10万円支給"],
["bmc","アパホテルの強み","土地・建物を自社所有（家賃が発生しない）、需給に応じた値付け（ダイナミックプライシング）、施工コストは同規模の1/3。営業利益率26.2%（東横イン19%、ドーミーイン11.7%）"],
["bmc","東横インの特徴","土地を借りて運営（売上の約2割が家賃）、女性を支配人に採用、全室「東横イン仕様」でメンテナンスの時間とお金を削減、開発・集客・内装をグループ会社で分担"],
["bmc","LCCの特徴（FSCとの比較）","運賃はFSCの約1/4。成田・関空など遠い空港、バスで搭乗、狭い座席・1クラス、手荷物・機内食・ブランケット有料、中小型機に統一、中短距離・高頻度運航（折り返し30分程度）、原則Web直販"],
["bmc","ローコスト型ビジネスモデルのポイント","標準化・規格化・スケールメリット・チェーンオペレーション・マニュアル。顧客の真のニーズ（価値）を見極め、不要なサービスを削る。稼働率を上げて投資効率を上げる"],
["bmc","ABCクッキングスタジオの革新","20〜34歳女性に特化、日常で使えるメニュー、少人数（講師1：生徒4〜5）で会話しながら実践、一等地にガラス張り（広告効果・家賃交渉）、調理器具メーカーから無償提供。目的が花嫁修業→趣味・自己投資・コミュニケーションの場"],
["bmc","AKB48の革新","会いに行けるアイドル（劇場・握手会）、大人数で嗜好の多様化に対応、素人が競いながら育つ過程を見せる、総選挙で序列を可視化、確立したフォーマットで国内外に展開（リナックス型・プラットフォーム）"],
["bmc","AKB48で収益の仕組みはどう変わった？","従来：CDの売上・入場料／AKB：CDは握手券・投票券を得るためのツール。オタ活の重点を「購入」から「参加」へ"],
["bmc","オフィスグリコの何が新しい？","全く新しい「売場」「並べ方」「料金回収方法（カエルの集金箱→QR）」「補充方法」。オフィスの箱でお菓子を無人販売"],
["bmc","オフィスグリコのポイント","メディア型販売（2週間ごとに入れ替え）、潜在市場の発掘（オフィスのTPOに合わせる）、メーカー直販で流通マージンを取り込む。約10万台（コンビニ5.7万店より多い）、2007年ビジネスモデル特許、回収率95%、防災備蓄にも"],
["bmc","【必読E-2】ウィラーエクスプレス","規制緩和後の高速バスに後発参入（古典的事業の刷新）。快適な座席・女性専用車で「快適な夜行バス」。自社サイト販売約98%＋需要に応じた運賃（ダイナミックプライシング）。IoTで眠気検知し安全に投資"],
["bmc","【必読E-4】京都花街の仕組み","お茶屋＝窓口・プロデューサー（料理屋・芸舞妓など専門業者を組み合わせて「おもてなし」）。置屋が住み込みで育成投資、学校（女紅場）、姉さん芸妓がメンター。350年続く"],
["bmc","京都花街の「一見さんお断り」の意味","紹介制・長期の後払い＝需要の安定、与信管理、価格ではなく質の競争。爆発的成長はしないが続く"],
["bmc","【E-6】コメリ","「農家のコンビニ」。農業アドバイザーが農家を訪問し相談を解決して信頼を得る（JAとも提携）。人口が少なくても出店できる低コストの店舗運営"],
["ds","IT化・デジタル化の位置づけ","第2の産業革命。全ての業界でデジタル戦略は不可欠"],
["ds","DXとは？","Digital Transformation＝知的作業の機械化。センサー、IoT、データアナリティクス、AI"],
["ds","社会の3段階（農業社会→産業革命→IT革命）","農業：人力・馬力・風力、毎年同じことの繰り返し／産業革命：化石燃料、大量生産、計画投資＝資本主義／IT革命：知的労働の機械化（AI）、マッチングと最適化、アセットの稼働率向上、データ＝経営資源、個別ニーズに個別対応"],
["ds","プラットフォームとは？（レジュメ）","モジュール×ネットワークを組み合わせた利用モデル（モジュール化の例：TVゲーム産業、ネットワーク化の例：電子書籍産業）"],
["ds","プラットフォームとは？（根来・F-2）","他のプレーヤーの製品・サービスと一体になって初めて価値を持つもの。基盤型（OSなど）と媒介型（予約サイトなど。シェアはこちら）がある"],
["ds","ECサイト（プラットフォーム）の収益源3つ","①ネットショップからの販売手数料 ②広告掲載料 ③ユーザーからの会費（参加料）"],
["ds","プラットフォームは消費者にとって何を意味する？","ユーザーの選択自由度の高まり（旧来は自動車のシートやプリンターのトナーなど選べなかった）"],
["ds","GAFAMとは？","Google、Amazon、Facebook、Apple、Microsoft＝プラットフォーマー。ほかにAlibaba、バイドゥ、日本では楽天。他業界でもコマツ、リクルート"],
["ds","プラットフォーマーをめぐる大きな戦略判断は？","プラットフォーマーをめざすか、サプライヤーに徹するか。一方で各国政府の規制（独禁法、個人情報保護）が強まっている"],
["ds","Amazonの広がり","1994年オンライン書店→2002年マーケットプレイス・AWS→2008年FBA（物流代行）→2013年Amazon Pay→2014年融資→Amazon Go・フレッシュ。売り手と買い手のネットワーク＝エコシステム"],
["ds","アリババの広がり","タオバオ・天猫（EC）→アリペイ（エスクロー＋信用格付け）→芝麻信用・余額宝・相互宝。「信用」の規格を作り、金融・信用事業へ進出"],
["ds","メーカーのサービス業化の例","フィリップス：電球を売るのをやめ、電気が常に光る状態を保証するサービスへ／ロールスロイス：航空エンジンを売らずに貸すサービスへ"],
["ds","コマツのDX","1999年コムトラックス（建機の稼働管理）、2001年センサを標準搭載→盗難防止・稼働率向上・債権回収コスト低下。他社建機にも装着、データ公開→中古価格上昇、アフターサービスが収益源。2015年スマートコンストラクション、3D測量（数日→数十分）"],
["ds","DXの本質（森川博之）","センサー装着→ネットで接続→データ蓄積→AIが分析→企業が意思決定→結果が再びデータに（データ駆動型）。「単なるDXは強みを進化させ、弱みを退化させる」→自社の強みにDXを"],
["ds","企業戦略の3類型","①GAFA型：プラットフォームで広範囲のエコシステム ②サプライヤー型：特定の製品・サービスのモジュールを提供（大多数の大企業）③B2B型：B2B領域でプラットフォームを作り、業際を超える（コマツ）"],
["ds","バリューチェーン構造 vs レイヤー構造","これまで：バリューチェーン（素材→部品→最終製品、消費者は最終段階でだけ選ぶ）／これから：レイヤー構造（レイヤーが積み重なり、消費者が各レイヤーを直接選んで組み合わせる）"],
["ds","自動車のレイヤー構造化","EV化でハード（車両）の分離が進む。車両・車両制御（ECU）・通信・車載端末/スマホナビ・テレマティクスが別々のレイヤーに"],
["ds","垂直統合 vs 水平分業","垂直統合：研究開発から量産まで自社（ノウハウ蓄積・多額の設備投資）／水平分業：各段階を外部に発注（設備不要・調達先を柔軟に変えられる）"],
["ds","アップルのモデル","「垂直統合の中に水平分業を持ち込む」。設計・OS・販売は自社、製造は委託。委託先の品質は徹底管理し、品質担保の機械はアップルが貸し出す"],
["ds","ブルーオーシャン vs レッドオーシャン","ブルー：競争のない新しい市場／レッド：競合がひしめく既存市場。シェアビジネスはブルーオーシャンの典型で既存ビジネスの脅威"],
["sh","シェアビジネスとは？","余剰の資源（設備、車、スペース、人材）をタイムリーに必要なところへ届けるマッチングサービス。消費者同士が貸し借りする"],
["sh","シェアビジネスの特徴（5つ）","①余計なモノ・不動産の活用 ②B2B・C2Cだけでなく P2P の存在 ③双方格付けの情報公開による信用創造 ④先行者有利（ブランディングとプラットフォームの構築）⑤急速なグローバル展開が可能"],
["sh","シェアビジネスの成立背景（3つ）","①インターネットの普及（個人でも不特定多数と取引可能）②スマートフォンの登場（どこでも手軽にネット）③決済システムの進化（カード情報を教えずに安全に決済）"],
["sh","P2Pビジネスの性格（3つ）","①オーナーとユーザーの個別取引→既存のB2B・B2Cより労働者の利益が高く、利用価格も安い ②オーナー・ユーザー両面の信用蓄積・全面情報公開（格付け、コメント、トラックレコード）③新しいスタイルの労働者と利用者"],
["sh","素人同士の取引で信用をどう作る？","マッチング会社が信用情報を仲介：トラックレコードの公開、レーティング（双方の格付け・レビュー）"],
["sh","Airbnbの仕組み","空き部屋を貸したいホストと借りたいゲストをつなぐ（2008年〜）。直接ではなくAirbnb上でやりとりし、相互レビューの信用蓄積が品質担保と価格形成を支える。手数料約15%"],
["sh","Uberの仕組みとドライバー","ライドシェア（2010年〜）。副業ドライバーがスキマ時間で稼ぐ。時給はタクシーより高い（平均19.04ドルvs12.90ドル）、週15時間以下が約半数。手数料約20%、車も運転手も持たない"],

["損益分岐点（BEP）について、図を描いて説明しなさい。","横軸に生産数量、縦軸に売上高／コストをとる。固定費（設備・人員など）は数量に関係なく一定なので水平線で描く。その上に、数量に比例して増える変動費（材料費・光熱水道費など）を積み、固定費の高さから始まる右上がりの総コスト線を描く。売上高は原点から右上がりの直線になる。売上高線と総コスト線が交わる点が損益分岐点で、売上高＝総コストとなり利益はゼロ。これより手前は赤字、超えると黒字になる。損益分岐点売上高＝固定費÷（1－変動費率）。損益分岐点が高い事業を固定費ビジネスといい、固定費の変動費化や回転率向上、変動費の調達改革で損益分岐点を下げられる。",["横軸＝数量、縦軸＝金額を書いた","固定費＝水平線（例も）","総コスト線＝固定費の上に変動費を積んだ右上がり（例も）","売上高線＝原点から右上がり","交点＝損益分岐点（売上＝総コスト、利益ゼロ）","手前は赤字・超えると黒字と書いた","式 or 下げ方（変動費化・回転率など）に触れた"],1],
["ビジネスモデルとは何か。その作り方とあわせて説明しなさい。","ビジネスモデルとは、他社には出せない価値を顧客に届けるためのその会社特有の、持続的に儲かる仕組みである。競合に対する差別化優位性の構造をつくり、それを早く作る・常に刷新する・ブランド・人材育成・特許などで持続させることが重要。作り方は、①3C（市場・競合・自社）に着目し、②ビジネスシステム（価値創造プロセス）を分析し、③収益方程式（利益＝売上－コスト、売上＝単価×個数）を設計する。例えばQBハウスは低い客単価×高い回転率という収益方程式で理髪業を刷新した。",["持続的に儲かる仕組みと書いた","差別化優位性と持続させる仕掛け","3C","ビジネスシステムの分析","収益方程式 P＝V－C","具体例を1つ入れた"]],
["ビジネスモデルはなぜ陳腐化するのか。また、どうやって再構築すればよいか説明しなさい。","陳腐化の原因は、技術革新（ドラム式洗濯機、ハイブリッド車）、業態開発（コンビニ、宅配便）、普及・量産による過当競争、川上・川下の構造変化（流通改革）、規制の強化・緩和、代替サービスの出現（郵便とネット）である。ビジネスモデルはいつでも崩壊するという自覚と、たえまない刷新が必要。再構築は、新たな市場ニーズ（特に問題解決）を見据え、自社の強みやアセットを活かし、競合優位性のある商品・サービスを、よそより早く提供して先行者優位性を築くことで行う。",["陳腐化の理由を3つ以上","例を添えた","たえまない刷新が必要","新たなニーズ（問題解決）","自社の強み・アセット","よそより早く（先行者優位）"]],
["ローコスト型と価値創出型のビジネスモデルの違いを、例を挙げて説明しなさい。","ローコスト型は、サービスを見直して不要なものを削り、標準化・マニュアル化・省力化・チェーン展開・スケールメリットで思い切った低価格を実現する型（ビジネスホテル、LCC、QBハウス、コンビニ）。稼働率・回転率を上げて投資効率を上げるのがポイント。価値創出型は、今までにない新たなサービスを生み、業界の枠を超える型（ABCクッキング、AKB48、オフィスグリコ、宅配便）で、新技術が契機の場合もある。レジュメでは「古典的事業の刷新」と「潜在ニーズの発掘」とも整理される。",["ローコスト型の定義とキーワード","ローコスト型の例","価値創出型の定義","価値創出型の例","稼働率・回転率への言及"]],
["シェアリングビジネスの特徴と成立背景を説明しなさい。","シェアビジネスは、余剰の資源（モノ・不動産・車・人材）を必要なところへ届けるマッチングサービスである。特徴は、①余計なモノ・不動産の活用、②B2B・C2CだけでなくP2Pの存在、③双方格付けの情報公開による信用創造、④先行者有利（ブランディングとプラットフォーム構築）、⑤急速なグローバル展開が可能、の5つ。成立背景は、①インターネットの普及で個人も不特定多数と取引できる、②スマートフォンでどこでも使える、③決済システムの進化でカード情報を教えずに安全に決済できる、の3つ。例：Airbnb、Uber。根来は成功原理を信頼・信用の仕組みとネットワーク効果とした。",["特徴を3つ以上","P2P","双方格付け・信用創造","成立背景3つ","例（Airbnb・Uberなど）"]],
["プラットフォームとは何か。バリューチェーン構造とレイヤー構造の違いにも触れて説明しなさい。","プラットフォームはモジュール×ネットワークを組み合わせた利用モデルで、他の製品・サービスと一体になって初めて価値を持つ（基盤型と媒介型）。ECでは販売手数料・広告掲載料・会費で稼ぎ、消費者は選択の自由度が高まる。従来のバリューチェーン構造では消費者は最終製品の段階でしか選べなかったが、レイヤー構造では各レイヤーを消費者が直接選び組み合わせる（自動車もEV化でレイヤー化が進む）。GAFAMがプラットフォーマーの代表で、プラットフォーマーをめざすかサプライヤーに徹するかは大きな戦略判断。",["モジュール×ネットワーク","収益源（手数料・広告・会費）","選択の自由度","バリューチェーン構造の説明","レイヤー構造の説明","GAFAMや戦略判断に触れた"]],
["デジタル化にあわせた企業戦略の3類型を説明しなさい。","①GAFA型：ECなどのプラットフォームを原動力に広範囲のエコシステムを構築し、金融や信用領域へも進出する（Amazon、アリババ）。②サプライヤー型：特定の製品・サービスのモジュールをGAFA型企業などに供給する。大多数の大企業が該当。③B2B型：B2B領域で業界内プラットフォームを構築し、業際を超えたエコシステムをつくる（コマツのコムトラックス、スマートコンストラクション）。",["GAFA型と例","サプライヤー型（大多数の大企業）","B2B型とコマツ","エコシステムという言葉"]],
["京都花街はなぜ350年も続いているのか。ビジネスモデルの観点から説明しなさい。","お茶屋が顧客の窓口・プロデューサーとなり、料理屋や芸舞妓など専門業者を組み合わせて「おもてなし」を提供する分業の仕組みがある。置屋が住み込みで費用を負担して芸舞妓を育て、学校（女紅場）と姉さん芸妓が型と技を伝える人材育成の仕組みが競争力の源。一見さんお断り（紹介制・後払い）で需要が安定し、与信管理ができ、価格ではなく質の競争になる。急成長より継続を重視し、環境変化に合わせて少しずつ刷新してきたため陳腐化しなかった。",["お茶屋＝窓口・プロデューサー","人材育成（置屋・学校）","一見さんお断りの効果","質の競争／持続性","刷新し続けた（陳腐化しない）"]],
];
const $=s=>document.getElementById(s);let LS={};try{LS=JSON.parse(localStorage.keiei2||"{}")}catch(e){}
const save=()=>{try{localStorage.keiei2=JSON.stringify(LS)}catch(e){}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const back='<button onclick="home()">← ホーム</button>';
function home(){let h='<h1>企業経営 ミニクイズ②対策</h1><p class="note">範囲：11/02 ビジネスモデル ＋ 11/09 デジタル戦略（必読・キーワード）＋ 損益分岐点（丸ごと書いて説明）</p><div class="tiles">';
h+=`<div class="tile hot" onclick="bep(0)"><b>📈 損益分岐点の図を描く練習</b><small>描く順番を1ステップずつ。最後に白紙で書いてみる</small></div>`;
h+='<h2>暗記カード</h2>';
for(const k in R){const n=C.filter(c=>c[0]==k),d=n.filter(c=>LS[c[1]]).length;
h+=`<div class="tile" onclick="cards('${k}')"><b>📇 ${R[k]}</b><small>${n.length}枚 ／ 覚えた ${d}</small><div class="bar"><i style="width:${d/n.length*100}%"></i></div></div>`}
h+=`<div class="tile" onclick="cards('all')"><b>📇 全部まとめて</b><small>${C.length}枚（シャッフル）</small></div>`;
h+='<h2>テスト</h2>';
h+=`<div class="tile" onclick="mock()"><b>📝 模擬クイズ（4択）</b><small>${M.length}問から20問・自動採点${LS._best!=null?' ／ 最高 '+LS._best+'点':''}</small></div>`;
h+=`<div class="tile" onclick="kijutsu(0)"><b>✍️ 記述問題</b><small>${K.length}問。書いてから模範解答とチェック表で自己採点</small></div>`;
h+='</div><p class="note">覚えた記録はこの端末のブラウザだけに残ります。</p>';$('app').innerHTML=h;scrollTo(0,0)}
let D=[],i=0,ng=[],_k;
function cards(k,only){_k=k;D=only?ng.slice():(k=='all'?shuf(C):C.filter(c=>c[0]==k));ng=[];i=0;show()}
function show(rev){if(i>=D.length){$('app').innerHTML=`${back}<div class="card"><div class="big">おわり</div>まだ：${ng.length}枚</div><div class="row"><button class="p" onclick="cards(_k,1)">まだの分だけ復習</button><button onclick="cards(_k)">最初から</button></div>`;return}
const c=D[i];$('app').innerHTML=`<div class="top">${back}<span>${i+1}/${D.length}</span></div><div class="card" onclick="show(1)"><span class="tag">${R[c[0]]}</span><br>${c[1]}${rev?`<div class="ans">${c[2]}</div>`:'<div style="color:#999;font-size:14px;margin-top:20px">タップで答え</div>'}</div>`+(rev?`<div class="row"><button class="ng" onclick="mk(0)">✕ まだ</button><button class="ok" onclick="mk(1)">○ 覚えた</button></div>`:'')}
function mk(o){const c=D[i];if(o)LS[c[1]]=1;else{delete LS[c[1]];ng.push(c)}save();i++;show()}
let T=[];
function mock(){T=shuf(M).slice(0,20).map(q=>{const o=shuf(q[2].map((t,j)=>[t,j==q[3]]));return{q,o}});
let h=`${back}<h1>模擬クイズ</h1>`;T.forEach((t,n)=>{h+=`<div class="q"><span class="tag">${R[t.q[0]]}</span> <b>Q${n+1}. ${t.q[1]}</b>`+t.o.map((o,j)=>`<label id="l${n}_${j}"><input type="radio" name="q${n}" value="${j}"> ${o[0]}</label>`).join('')+`<div class="ex" id="e${n}">💡 ${t.q[4]}</div></div>`});
h+='<button class="p" style="width:100%" onclick="grade()">採点する</button><div id="res"></div>';$('app').innerHTML=h;scrollTo(0,0)}
function grade(){let s=0;T.forEach((t,n)=>{const v=document.querySelector(`input[name=q${n}]:checked`);t.o.forEach((o,j)=>{if(o[1])$(`l${n}_${j}`).className='right'});
if(v&&t.o[v.value][1])s++;else if(v)$(`l${n}_${v.value}`).className='wrong';$('e'+n).style.display='block'});
const p=Math.round(s/T.length*100);if(LS._best==null||p>LS._best)LS._best=p;save();
$('res').innerHTML=`<div class="card"><div class="big">${s} / ${T.length}（${p}点）</div>間違えた問題は上の解説を確認してください。</div><button class="p" onclick="mock()">もう一度（別の問題）</button>`;$('res').scrollIntoView()}
function kijutsu(n){if(n>=K.length){home();return}const k=K[n];
$('app').innerHTML=`<div class="top">${back}<span>${n+1}/${K.length}</span></div><div class="q"><b>${k[0]}</b>${k[3]?'<p class="note">図は紙に描いてから見比べよう。</p>':''}<textarea id="ta" placeholder="ここに書く（メモでOK）"></textarea><button class="p" onclick="kAns(${n})">模範解答を見る</button><div id="ka"></div></div>`;scrollTo(0,0)}
function kAns(n){const k=K[n];$('ka').innerHTML=(k[3]?svg(9):'')+`<div class="ans">${k[1]}</div><p><b>チェック（書けたものに✓）</b></p>`+k[2].map(c=>`<label><input type="checkbox" onchange="kc()" class="kc"> ${c}</label>`).join('')+`<p id="ks"></p><button onclick="kijutsu(${n+1})">次の問題 →</button>`}
function kc(){const a=[...document.querySelectorAll('.kc')];$('ks').textContent=`${a.filter(x=>x.checked).length} / ${a.length} 点`}
// 損益分岐点の図（原点(50,230)、BEP(218,110)）
const ST=[
["① 軸を描く","横軸＝<b>生産数量（個）</b>、縦軸＝<b>売上高／コスト（円）</b>。"],
["② 固定費を描く","<b>固定費</b>（設備・人員・家賃など）は、作る数に関係なく一定 → <b>水平な線</b>。"],
["③ 変動費を積む（総コスト線）","<b>変動費</b>（材料代・光熱水道費など）は数に比例して増える。固定費の上に積むので、<b>固定費の高さから始まる右上がりの線</b>＝総コスト。"],
["④ 売上高を描く","<b>売上高</b>＝単価×個数。0個なら0円なので<b>原点から始まる右上がりの線</b>。総コスト線より傾きが急。"],
["⑤ 交点＝損益分岐点","売上高線と総コスト線が交わる点＝<b>損益分岐点</b>。売上高＝総コストで<b>利益ゼロ</b>。"],
["⑥ 赤字と黒字","交点より<b>手前は赤字</b>（コスト＞売上）、<b>超えると黒字</b>（線の間が利益）。"],
["⑦ 一言そえる","式：損益分岐点売上高＝固定費÷（1－変動費率）。損益分岐点が高い事業＝<b>固定費ビジネス</b>。下げるには固定費の変動費化・回転率向上、変動費の調達改革など。"],
];
function svg(s){const v=n=>s>=n?'':' style="display:none"';
return `<svg class="bep" viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
<g${v(6)}><polygon points="50,170 218,110 50,230" fill="#c0533f" opacity=".18"/><polygon points="218,110 330,30 330,70" fill="#3a8f5c" opacity=".25"/><text x="70" y="185" fill="#c0533f" font-weight="bold">赤字</text><text x="333" y="50" fill="#1d4f2e" font-weight="bold">黒字</text><text x="333" y="64" fill="#1d4f2e">利益</text></g>
<g${v(3)}><polygon points="50,170 330,70 330,170" fill="#e8b04a" opacity=".2"/><line x1="50" y1="170" x2="330" y2="70" stroke="#c98a14" stroke-width="3"/><text x="232" y="138" fill="#8a5e00">変動費</text><text x="326" y="92" fill="#8a5e00" text-anchor="end">総コスト</text></g>
<g${v(2)}><rect x="50" y="170" width="280" height="60" fill="#8aa5c4" opacity=".25"/><line x1="50" y1="170" x2="330" y2="170" stroke="#2d5d8a" stroke-width="3"/><text x="190" y="205" fill="#2d5d8a" text-anchor="middle">固定費（設備・人員など）</text></g>
<g${v(4)}><line x1="50" y1="230" x2="330" y2="30" stroke="#222" stroke-width="3"/><text x="318" y="24" text-anchor="end" font-weight="bold">売上高</text></g>
<g${v(5)}><line x1="218" y1="110" x2="218" y2="230" stroke="#666" stroke-dasharray="4 3"/><circle cx="218" cy="110" r="6" fill="#c0533f"/><text x="160" y="96" fill="#c0533f" font-weight="bold">損益分岐点</text><text x="218" y="244" text-anchor="middle" fill="#666">BEPの数量</text></g>
<g${v(1)}><line x1="50" y1="230" x2="340" y2="230" stroke="#222" stroke-width="2"/><line x1="50" y1="230" x2="50" y2="15" stroke="#222" stroke-width="2"/><text x="340" y="262" text-anchor="end">生産数量（個）→</text><text x="8" y="14">↑売上高／コスト（円）</text><text x="44" y="244" text-anchor="end">0</text></g>
</svg>`}
function bep(s){if(s>ST.length){kijutsu(0);return}
let h=`<div class="top">${back}<span>${Math.min(s,ST.length)}/${ST.length}</span></div><h1>📈 損益分岐点の図</h1>`+svg(s);
h+=s==0?'<div class="stepbox">「BEPを図で説明せよ」が出たら、この順番で描きます。紙とペンを用意して、1ステップずつ真似して描いてみよう。</div>':`<div class="stepbox"><b>${ST[s-1][0]}</b><br>${ST[s-1][1]}</div>`;
h+=`<div class="row">${s>0?`<button onclick="bep(${s-1})">← 前へ</button>`:''}<button class="p" onclick="bep(${s+1})">${s==0?'はじめる':s==ST.length?'白紙で書いてみる（記述へ）':'次へ →'}</button></div>`;
$('app').innerHTML=h;scrollTo(0,0)}
home();
