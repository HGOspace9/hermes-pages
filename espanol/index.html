<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スペイン語 単語クイズ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#fdf6ec;color:#222}
.w{max-width:520px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
button{font-size:16px;padding:12px;border:0;border-radius:12px;background:#e8dcc8;cursor:pointer;color:#222}
button.on,.main{background:#c0392b;color:#fff}
.good{background:#27ae60;color:#fff}.bad{background:#e67e22;color:#fff}
.card{background:#fff;border-radius:18px;padding:24px 18px;text-align:center;box-shadow:0 3px 12px #0001;min-height:190px}
.q{font-size:28px;font-weight:700;margin:10px 0}.en{color:#888;font-size:15px}
.a{font-size:24px;color:#c0392b;font-weight:700;margin-top:14px}.pos{color:#888;font-size:14px}
input{width:100%;font-size:20px;padding:12px;border:2px solid #ddd;border-radius:12px;margin-top:14px}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
.ok{color:#27ae60;font-weight:700}.ng{color:#c0392b;font-weight:700}
.meta{color:#777;font-size:14px;margin:8px 0;text-align:center}
.bar{display:flex;justify-content:space-between;font-size:15px;margin:0 4px 8px}
.acc{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.acc button{padding:8px 12px;font-size:18px;flex:1}
ul{background:#fff;border-radius:14px;padding:12px 12px 12px 30px}li{margin:6px 0}
.lab{font-size:13px;color:#777;margin-top:12px;text-align:left}.sel{display:flex;gap:6px;margin-top:4px}.sel button{flex:1;padding:10px 4px;font-size:15px}
#res div{margin:3px 0}
.big{font-size:40px;margin:6px 0}.col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
</style></head><body><div class="w">
<h1>🇪🇸 スペイン語 単語クイズ</h1>
<div class="tabs"><button id="t1" class="on" onclick="mode('card')">めくる</button><button id="t2" onclick="mode('type')">書いて答える</button><button id="t3" onclick="mode('list')">一覧</button></div>
<div id="app"></div>
<p class="meta">日本語を見てスペイン語を答えます</p>
</div>
<script>
// 単語の追加はここ: [スペイン語, 品詞, 英語, 日本語]
const W=[
["Barcelona","固有名詞","Barcelona","バルセロナ"],
["amor","名詞・男性","Love","愛"],
["la nevera","名詞・女性","Fridge","冷蔵庫"],
["la bolsa","名詞・女性","Stock market","株式市場"],
["la acción","名詞・女性","Share, stock","株"],
["invertir","動詞","To invest","投資する"],
["ganar","動詞","To win, to earn","勝つ・稼ぐ"],
["el café","名詞・男性","Coffee, café","コーヒー・カフェ"],
["la cafetería","名詞・女性","Café","喫茶店"],
["la publicidad","名詞・女性","Advertising","広告"],
["el cartel","名詞・男性","Poster","ポスター"],
["diseñar","動詞","To design","デザインする"],
["el videojuego","名詞・男性","Video game","テレビゲーム"],
["el barco","名詞・男性","Ship","船"],
["el ordenador","名詞・男性","Computer","パソコン"],
["la inteligencia artificial","名詞・女性","Artificial intelligence","人工知能"],
["la universidad","名詞・女性","University","大学"],
["la residencia","名詞・女性","Dormitory","寮"],
["estudiar","動詞","To study","勉強する"],
["aprender","動詞","To learn","学ぶ"],
["gratis","形容詞","Free (of charge)","無料の"],
["barato","形容詞・男性","Cheap","安い"],
["rápido","形容詞・男性","Fast","速い"],
["la canción","名詞・女性","Song","歌"],
["viajar","動詞","To travel","旅行する"],
];
const $=id=>document.getElementById(id);
const KEY='esp_int1_marks';
let marks=JSON.parse(localStorage.getItem(KEY)||'{}'); // スペイン語 -> 'ok' | 'ng'
let pool=[],i=0,m='card',rev=false,answered=false,okR=[],ngR=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(marks));
const shuf=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function start(which){ // 'all' | 'ng'
 pool=shuf(W.map((_,k)=>k).filter(k=>which=='all'||marks[W[k][0]]!='ok'));
 if(!pool.length)pool=shuf(W.map((_,k)=>k));
 i=0;okR=[];ngR=[];rev=false;answered=false;show()}
function mode(x){m=x;['card','type','list'].forEach((k,n)=>$('t'+(n+1)).className=k==x?'on':'');rev=false;answered=false;show()}
function mark(r){const w=W[pool[i]];marks[w[0]]=r;save();(r=='ok'?okR:ngR).push(pool[i]);i++;rev=false;answered=false;show()}
function bar(){return `<div class=bar><span class=ng>✕ まだ ${ngR.length}</span><span>${Math.min(i+1,pool.length)} / ${pool.length}</span><span class=ok>○ 覚えた ${okR.length}</span></div>`}
function summary(){
 const rest=W.filter(w=>marks[w[0]]!='ok').length;
 $('app').innerHTML=`<div class=card><div class=big>${ngR.length?'💪':'🎉'}</div>
 <div class=q>このラウンド終了</div>
 <p><span class=ok>○ 覚えた ${okR.length}</span>　<span class=ng>✕ まだ ${ngR.length}</span></p>
 ${ngR.length?'<ul style="text-align:left">'+ngR.map(k=>`<li>${W[k][3]} → <b>${W[k][0]}</b></li>`).join('')+'</ul>':''}
 <div class=col>${rest?`<button class=main onclick="start('ng')">まだの単語だけ復習（${rest}語）</button>`:''}
 <button onclick="start('all')">全部もう一度</button>
 <button onclick="if(confirm('覚えた記録を全部消しますか？')){marks={};save();start('all')}">記録をリセット</button></div></div>`}
function show(){
 if(m=='list'){
  const ok=W.filter(w=>marks[w[0]]=='ok').length,ng=W.filter(w=>marks[w[0]]=='ng').length;
  $('app').innerHTML=`<p class=meta><span class=ok>○ 覚えた ${ok}</span>　<span class=ng>✕ まだ ${ng}</span>　未挑戦 ${W.length-ok-ng}</p><ul>`+
  W.map(w=>`<li>${marks[w[0]]=='ok'?'<span class=ok>○</span>':marks[w[0]]=='ng'?'<span class=ng>✕</span>':'・'} <b>${w[3]}</b> → ${w[0]} <span class=pos>(${w[1]})</span></li>`).join('')+'</ul>';return}
 if(i>=pool.length)return summary();
 const w=W[pool[i]];
 if(m=='card'){
  $('app').innerHTML=bar()+`<div class=card onclick="rev=!rev;show()"><div class=q>${w[3]}</div><div class=en>${w[2]}</div>
  ${rev?`<div class=a>${w[0]}</div><div class=pos>${w[1]}</div>`:'<div class=meta>タップで答え</div>'}</div>
  <div class=row><button class=bad onclick="mark('ng')">✕ まだ</button><button class=good onclick="mark('ok')">○ 覚えた</button></div>`;return}
 $('app').innerHTML=bar()+`<div class=card><div class=q>${w[3]}</div><div class=en>${w[2]}</div>
 <input id=in autocomplete=off autocapitalize=off placeholder="スペイン語で入力" onkeydown="if(event.key=='Enter'){answered?nextT():check()}">
 <div class=acc>${'áéíóúñ'.split('').map(c=>`<button onclick="ins('${c}')">${c}</button>`).join('')}</div>
 <div class=lab>品詞</div><div class=sel id=sp>${POS.map(p=>`<button onclick="pick('p','${p}')">${p}</button>`).join('')}</div>
 <div class=lab>性（男性・女性）</div><div class=sel id=sg>${GEN.map(g=>`<button onclick="pick('g','${g}')">${g}</button>`).join('')}</div>
 <div id=res></div></div>
 <div class=row><button id=btn class=main onclick="answered?nextT():check()">答え合わせ</button></div>`;
 selP=selG=null;$('in').focus()}
const POS=['名詞','動詞','形容詞','その他'],GEN=['男性','女性','なし'];
let selP=null,selG=null;
function info(w){const[p,g]=w[1].split('・');return{p:POS.includes(p)?p:'その他',g:g||'なし'}}
function pick(t,v){if(answered)return;if(t=='p')selP=v;else selG=v;
 [...$(t=='p'?'sp':'sg').children].forEach(b=>b.className=b.textContent==v?'on':'')}
function ins(c){const e=$('in');e.value+=c;e.focus()}
const strip=s=>s.trim().toLowerCase().replace(/^(el|la|los|las)\s+/,'');
const norm=s=>strip(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').trim();
let lastOk=false;
function check(){const w=W[pool[i]],v=$('in').value;
 if(!v||!selP||!selG){$('res').innerHTML='<p class=meta>単語・品詞・性をすべて選んでください</p>';return}
 const f=info(w),okW=norm(v)==norm(w[0]),okP=selP==f.p,okG=selG==f.g;
 lastOk=okW&&okP&&okG;answered=true;
 const line=(ok,label,ans)=>`<div class=${ok?'ok':'ng'}>${ok?'○':'✕'} ${label}：${ans}</div>`;
 $('res').innerHTML=`<p class=${lastOk?'ok':'ng'}>${lastOk?'⭕ 全部正解！':'❌ 惜しい'}</p>`+
  line(okW,'単語',w[0]+(okW&&strip(v)!=strip(w[0])?'（アクセント記号に注意）':''))+line(okP,'品詞',f.p)+line(okG,'性',f.g);
 $('btn').textContent='次へ →'}
function nextT(){mark(lastOk?'ok':'ng')}
start('all');
</script></body></html>
