<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スペイン語 単語クイズ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#fdf6ec;color:#222}
.w{max-width:520px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:6px 0 10px}
select{width:100%;font-size:16px;padding:10px;border-radius:12px;border:2px solid #e8dcc8;background:#fff;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
button{font-size:16px;padding:12px;border:0;border-radius:12px;background:#e8dcc8;cursor:pointer;color:#222}
button.on,.main{background:#c0392b;color:#fff}
.good{background:#27ae60;color:#fff}.bad{background:#e67e22;color:#fff}
.card{background:#fff;border-radius:18px;padding:24px 18px;text-align:center;box-shadow:0 3px 12px #0001;min-height:190px}
.q{font-size:26px;font-weight:700;margin:10px 0}.en{color:#888;font-size:15px}
.a{font-size:24px;color:#c0392b;font-weight:700;margin-top:14px}.pos{color:#888;font-size:14px}
input{width:100%;font-size:20px;padding:12px;border:2px solid #ddd;border-radius:12px;margin-top:14px}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
.ok{color:#27ae60;font-weight:700}.ng{color:#c0392b;font-weight:700}
.meta{color:#777;font-size:14px;margin:8px 0;text-align:center}
.bar{display:flex;justify-content:space-between;font-size:15px;margin:0 4px 8px}
.acc{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.acc button{padding:8px 10px;font-size:18px;flex:1}
ul{background:#fff;border-radius:14px;padding:12px 12px 12px 30px}li{margin:6px 0}
.lab{font-size:13px;color:#777;margin-top:12px;text-align:left}.sel{display:flex;gap:6px;margin-top:4px}.sel button{flex:1;padding:10px 4px;font-size:15px}
#res div{margin:3px 0}
.spk{padding:4px 10px;font-size:18px;background:#f3ead9;vertical-align:middle}
.big{font-size:40px;margin:6px 0}.col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.hero{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 3px 12px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
.tile{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 3px 12px #0001;border-top:6px solid var(--c);cursor:pointer;min-height:200px;display:flex;flex-direction:column;transition:transform .1s}
.tile:active{transform:scale(.97)}
.emo{font-size:34px}.tt{font-size:19px;font-weight:800;margin:6px 0 4px;color:var(--c)}
.td{font-size:13px;color:#555;line-height:1.45;flex:1}.tx{font-size:12px;color:#999;margin-top:8px;font-style:italic}
.pb{height:6px;background:#eee;border-radius:3px;margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--c)}
.tc{font-size:12px;color:#777;margin-top:4px}
</style></head><body><div class="w">
<h1 onclick="home()" style="cursor:pointer">🇪🇸 スペイン語 練習</h1>
<div id="top" style="display:none"><div class="row" style="margin:0 0 8px"><button onclick="home()">← ホーム</button><button id="ordb" onclick="ord=!ord;localStorage.setItem('esp_ord',ord?1:0);start('all')"></button></div><div id="now" class="meta"></div>
<div class="tabs"><button id="t1" class="on" onclick="mode('card')">めくる</button><button id="t2" onclick="mode('type')">書いて答える</button><button id="t3" onclick="mode('list')">一覧</button></div>
</div><div id="app"></div>
<p class="meta">日本語を見てスペイン語を答えます</p>
</div>
<script src="words.js"></script>
<script>
const $=id=>document.getElementById(id);
const KEY='esp_int1_marks';
let marks=JSON.parse(localStorage.getItem(KEY)||'{}');
let pool=[],i=0,m='card',rev=false,answered=false,okR=[],ngR=[];
// グループ（規則性ごと）
const GROUPS=[
 ["🔢 数字","0〜100を順番に。16〜29や「treinta y uno」のような組み立ての規則をつかもう",["数字 0-100"],"#3498db","cero, uno, dos… veintiuno"],
 ["👋 あいさつ・会話","あいさつ・別れの言葉と、名前・出身・年齢・仕事をたずねる質問と答え",["U0 あいさつ","U1 質問と答え"],"#e67e22","¡Hola! / ¿De dónde eres?"],
 ["📚 教科書の単語","教室のもの・職業・職場・国籍・個人情報・文化・週末にしたいこと",["U0 教室のもの","U1 職業","U1 職場","U1 国籍","U1 個人情報","U2 文化","U2 週末にしたいこと"],"#27ae60","la silla, el profesor"],
 ["🔁 動詞の活用","ser・tener・llamarse・querer を yo, tú, él… の人称ごとに",["U1 動詞の活用","U2 動詞の活用"],"#9b59b6","soy, eres, es…"],
];
let cats=[],label='',ord=localStorage.getItem('esp_ord')!='0';
const inCat=k=>cats.includes(W[k][4]);
const cnt=cs=>W.filter(w=>cs.includes(w[4])).length;
function home(){m='home';$('top').style.display='none';
 $('app').innerHTML=`<div class=hero><div style="font-size:15px;color:#a0522d">Aula Internacional Plus 1 ・ Unidad 0〜2</div>
 <div style="font-size:24px;font-weight:800;margin:4px 0">何を練習しますか？</div>
 <div class=pos>グループごとに、規則のまとまりで覚えられます</div></div>
 <div class=grid>`+GROUPS.map((g,n)=>{const L=W.filter(w=>g[2].includes(w[4])),ok=L.filter(w=>marks[w[0]]=='ok').length,pc=Math.round(ok*100/L.length);
 return `<div class=tile style="--c:${g[3]}" onclick="group(${n})">
 <div class=emo>${g[0].split(' ')[0]}</div><div class=tt>${g[0].split(' ').slice(1).join(' ')}</div>
 <div class=td>${g[1]}</div><div class=tx>例：${g[4]}</div>
 <div class=pb><i style="width:${pc}%"></i></div><div class=tc>${L.length}問 ・ 覚えた ${ok}</div></div>`}).join('')+`</div>`}
function group(n){const g=GROUPS[n];m='home';$('top').style.display='none';
 $('app').innerHTML=`<button onclick="home()" style="margin-bottom:12px">← ホーム</button>
 <div class=tile style="--c:${g[3]};cursor:default"><div class=emo>${g[0].split(' ')[0]}</div><div class=tt>${g[0].split(' ').slice(1).join(' ')}</div><div class=td>${g[1]}</div></div>
 <div class=col><button class=main style="font-size:18px;padding:16px" onclick="go(${n},-1)">まとめて練習（${cnt(g[2])}問）</button>
 ${g[2].length>1?g[2].map((c,j)=>`<button onclick="go(${n},${j})">${c.replace(/^U\d /,'')}　<span class=pos>${cnt([c])}問</span></button>`).join(''):''}</div>`}
function go(n,j){const g=GROUPS[n];cats=j<0?g[2]:[g[2][j]];label=g[0]+(j<0?'':' › '+g[2][j]);
 $('top').style.display='';mode('card');start('all')}
const save=()=>localStorage.setItem(KEY,JSON.stringify(marks));
const shuf=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function start(which){$('now').textContent=label;$('ordb').textContent=ord?'🔢 順番どおり（タップでシャッフル）':'🔀 シャッフル（タップで順番どおり）';
 const all=W.map((_,k)=>k).filter(inCat),mix=a=>ord?a:shuf(a);
 pool=mix(all.filter(k=>which=='all'||marks[W[k][0]]!='ok'));if(!pool.length)pool=mix(all);
 i=0;okR=[];ngR=[];rev=false;answered=false;show()}
function mode(x){if(m=='home'&&x!='card')return;m=x;['card','type','list'].forEach((k,n)=>$('t'+(n+1)).className=k==x?'on':'');rev=false;answered=false;show()}
function mark(r){const w=W[pool[i]];marks[w[0]]=r;save();(r=='ok'?okR:ngR).push(pool[i]);i++;rev=false;answered=false;show()}
function bar(){return `<div class=bar><span class=ng>✕ まだ ${ngR.length}</span><span>${Math.min(i+1,pool.length)} / ${pool.length}</span><span class=ok>○ 覚えた ${okR.length}</span></div>`}
function summary(){
 const rest=W.filter((w,k)=>inCat(k)&&marks[w[0]]!='ok').length;
 $('app').innerHTML=`<div class=card><div class=big>${ngR.length?'💪':'🎉'}</div><div class=q>このラウンド終了</div>
 <p><span class=ok>○ 覚えた ${okR.length}</span>　<span class=ng>✕ まだ ${ngR.length}</span></p>
 ${ngR.length?'<ul style="text-align:left">'+ngR.map(k=>`<li>${W[k][3]} → <b>${W[k][0]}</b></li>`).join('')+'</ul>':''}
 <div class=col>${rest?`<button class=main onclick="start('ng')">まだの単語だけ復習（${rest}）</button>`:''}
 <button onclick="start('all')">全部もう一度</button>
 <button onclick="if(confirm('覚えた記録を全部消しますか？')){marks={};save();start('all')}">記録をリセット</button></div></div>`}
const hasPG=w=>/^(名詞|動詞|形容詞|固有名詞)/.test(w[1]);
function show(){
 if(m=='list'){const L=W.filter((w,k)=>inCat(k));
  const ok=L.filter(w=>marks[w[0]]=='ok').length,ng=L.filter(w=>marks[w[0]]=='ng').length;
  $('app').innerHTML=`<p class=meta><span class=ok>○ 覚えた ${ok}</span>　<span class=ng>✕ まだ ${ng}</span>　未挑戦 ${L.length-ok-ng}</p><ul>`+
  L.map(w=>`<li>${spk(w[0])} ${marks[w[0]]=='ok'?'<span class=ok>○</span>':marks[w[0]]=='ng'?'<span class=ng>✕</span>':'・'} <b>${w[3]}</b> → ${w[0]} <span class=pos>(${w[1]})</span></li>`).join('')+'</ul>';return}
 if(i>=pool.length)return summary();
 const w=W[pool[i]];
 if(m=='card'){
  $('app').innerHTML=bar()+`<div class=card onclick="rev=!rev;show();if(rev)say(W[pool[i]][0])"><div class=q>${w[3]}</div><div class=en>${w[2]}</div>
  ${rev?`<div class=a>${w[0]} ${spk(w[0])}</div><div class=pos>${w[1]}</div>`:'<div class=meta>タップで答え</div>'}</div>
  <div class=row><button class=bad onclick="mark('ng')">✕ まだ</button><button class=good onclick="mark('ok')">○ 覚えた</button></div>`;return}
 const pg=hasPG(w);
 $('app').innerHTML=bar()+`<div class=card><div class=q>${w[3]}</div><div class=en>${w[2]}</div>
 <input id=in autocomplete=off autocapitalize=off placeholder="スペイン語で入力" onkeydown="if(event.key=='Enter'){answered?nextT():check()}">
 <div class=acc>${'áéíóúñ¿¡'.split('').map(c=>`<button onclick="ins('${c}')">${c}</button>`).join('')}</div>
 ${pg?`<div class=lab>品詞</div><div class=sel id=sp>${POS.map(p=>`<button onclick="pick('p','${p}')">${p}</button>`).join('')}</div>
 <div class=lab>性（男性・女性）</div><div class=sel id=sg>${GEN.map(g=>`<button onclick="pick('g','${g}')">${g}</button>`).join('')}</div>`:''}
 <div id=res></div></div>
 <div class=row><button id=btn class=main onclick="answered?nextT():check()">答え合わせ</button></div>`;
 selP=selG=null;$('in').focus()}
const POS=['名詞','動詞','形容詞','その他'],GEN=['男性','女性','なし'];
let selP=null,selG=null;
function info(w){const[p,g]=w[1].split('・');return{p:POS.includes(p)?p:'その他',g:g||'なし'}}
function pick(t,v){if(answered)return;if(t=='p')selP=v;else selG=v;
 [...$(t=='p'?'sp':'sg').children].forEach(b=>b.className=b.textContent==v?'on':'')}
function ins(c){const e=$('in');e.value+=c;e.focus()}
const strip=s=>s.trim().toLowerCase().replace(/[¿?¡!.,]/g,'').replace(/\s+/g,' ').trim().replace(/^(el|la|los|las|un|una|unos|unas)\s+/,'');
const norm=s=>strip(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();
let lastOk=false;
function check(){const w=W[pool[i]],v=$('in').value,pg=hasPG(w);
 if(!v||(pg&&(!selP||!selG))){$('res').innerHTML='<p class=meta>'+(pg?'単語・品詞・性をすべて選んでください':'スペイン語を入力してください')+'</p>';return}
 const alts=w[0].split(' / ').concat([w[0]]);
 const okW=alts.some(a=>norm(v)==norm(a)),exact=alts.some(a=>strip(v)==strip(a));
 const f=info(w),okP=!pg||selP==f.p,okG=!pg||selG==f.g;
 lastOk=okW&&okP&&okG;answered=true;
 const line=(ok,label,ans)=>`<div class=${ok?'ok':'ng'}>${ok?'○':'✕'} ${label}：${ans}</div>`;
 $('res').innerHTML=`<p class=${lastOk?'ok':'ng'}>${lastOk?'⭕ 正解！':'❌ 惜しい'}</p>`+
  line(okW,'答え',spk(w[0])+' '+w[0]+(okW&&!exact?'（アクセント記号に注意）':''))+(pg?line(okP,'品詞',f.p)+line(okG,'性',f.g):'');
 $('btn').textContent='次へ →';say(w[0])}
function nextT(){mark(lastOk?'ok':'ng')}
let ES=null;const pickV=()=>{const v=speechSynthesis.getVoices();ES=v.find(x=>x.lang=='es-ES')||v.find(x=>x.lang.startsWith('es'))||null};
if(window.speechSynthesis){pickV();speechSynthesis.onvoiceschanged=pickV}
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/ \/ /g,', '));u.lang='es-ES';if(ES)u.voice=ES;u.rate=0.85;speechSynthesis.speak(u)}
const spk=t=>`<button class=spk onclick="event.stopPropagation();say(this.dataset.t)" data-t="${t}">🔊</button>`;
home();
</script></body></html>
