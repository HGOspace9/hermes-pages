<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>エンドレス 統計</title>
<style>
:root{--navy:#1A5CA8;--light:#8FB0DA;--pink:#D6336C;--line:#E3E6EB;--text:#222;--sub:#6B7280;--bg:#F3F5F8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--text)}
header{background:#fff;border-bottom:3px solid var(--navy);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
header .who{font-size:12px;color:var(--sub)}
main{max-width:880px;margin:20px auto;padding:0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px 24px 26px}
h2{font-size:18px;margin:0 0 18px;padding-left:10px;border-left:5px solid var(--navy);line-height:1.3}
.label{font-size:12px;color:var(--sub);margin:0 0 6px}
.tabs{display:flex;gap:6px;border-bottom:3px solid var(--navy);margin-bottom:16px;overflow-x:auto}
.tab{flex:none;padding:8px 16px;font-size:14px;font-weight:700;color:var(--navy);border:1px solid var(--navy);border-bottom:none;border-radius:4px 4px 0 0;background:#fff;cursor:pointer;font-family:inherit}
.tab.on{background:var(--navy);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;user-select:none;background:none;border:0;padding:0;font-family:inherit;color:inherit}
.sw{width:40px;height:22px;border-radius:11px;background:#C9CED6;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle[aria-pressed=true] .sw{background:var(--navy)}
.toggle[aria-pressed=true] .sw::after{left:21px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.ctitle{text-align:center;font-weight:700;font-size:14px;margin:10px 0 4px}
.msg{font-size:12px;color:var(--sub);text-align:center;min-height:1em;margin:4px 0}
.note{font-size:11px;color:var(--sub);text-align:right;margin-top:6px}
.badge{font-size:11px;color:#fff;background:var(--pink);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:2px}
/* 鍵の画面 */
#lock{max-width:360px;margin:60px auto;text-align:center}
#lock input{width:100%;font-size:16px;padding:10px 12px;border:1px solid #B8C0CC;border-radius:4px;margin:12px 0}
#lock button{width:100%;font-size:15px;font-weight:700;padding:10px;border:0;border-radius:4px;background:var(--navy);color:#fff;cursor:pointer;font-family:inherit}
#lock .err{color:var(--pink);font-size:13px;min-height:1.2em;margin-top:10px}
#app{display:none}
svg text{font-family:inherit}
</style></head><body>
<header><h1>エンドレス 統計</h1><div class="who">メンバー専用</div></header>
<main>
 <div id="lock" class="card">
  <h2 style="text-align:left">パスワード</h2>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" required>
  <button>開く</button></form>
  <div class="err" id="err"></div>
 </div>
 <div id="app" class="card">
  <h2>売上<span class="badge" id="badge" hidden>仮の数字</span></h2>
  <p class="label">期間</p>
  <div class="tabs" id="tabs"></div>
  <div class="row">
   <button class="toggle" id="cmp" aria-pressed="false"><span class="sw"></span>前年と比べる</button>
   <div class="legend" id="legend"></div>
  </div>
  <div class="ctitle">月ごとの売上（円）</div>
  <div id="chart"></div>
  <div class="msg" id="msg"></div>
  <div class="note">春＝4〜7月　秋＝10〜翌1月</div>
 </div>
</main>
<script>
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const enc=await (await fetch("data.enc.json",{cache:"no-store"})).json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
$("f").onsubmit=async e=>{
  e.preventDefault();$("err").textContent="確かめています…";
  try{start(await unlock($("pw").value))}
  catch(_){$("err").textContent="パスワードが違います"}
};

// 学期: 春=4〜7月、秋=10〜翌1月
const SEM={春:[[0,4],[0,5],[0,6],[0,7]],秋:[[0,10],[0,11],[0,12],[1,1]]};
let D,cur,cmp=false;
const key=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;
const vals=(y,s)=>SEM[s].map(([dy,m])=>D.months[key(y+dy,m)]??null);
const has=(y,s)=>vals(y,s).some(v=>v!=null);
function start(data){
  D=data;$("lock").style.display="none";$("app").style.display="block";
  $("badge").hidden=!/仮/.test(D.note||"");
  const ys=[...new Set(Object.keys(D.months).map(k=>+k.slice(0,4)))].sort();
  const list=[];
  for(const y of ys)for(const s of["春","秋"])if(has(y,s)&&!list.some(t=>t.y==y&&t.s==s))list.push({y,s});
  $("tabs").innerHTML=list.map((t,i)=>`<button class="tab" data-i="${i}">${t.y} ${t.s}</button>`).join("");
  $("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){cur=list[b.dataset.i];draw()}};
  cur=list[list.length-1];
  setTimeout(()=>{const t=$("tabs");t.scrollLeft=t.scrollWidth},0);
  $("cmp").onclick=()=>{cmp=!cmp;$("cmp").setAttribute("aria-pressed",cmp);draw()};
  draw();
}
function draw(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.textContent==`${cur.y} ${cur.s}`));
  const now=vals(cur.y,cur.s), prevOk=has(cur.y-1,cur.s), prev=cmp&&prevOk?vals(cur.y-1,cur.s):null;
  $("msg").textContent=cmp&&!prevOk?`${cur.y-1} ${cur.s}のデータはありません`:"";
  $("legend").innerHTML=`<span><i style="background:var(--navy)"></i>${cur.y} ${cur.s}</span>`+(prev?`<span><i style="background:var(--light)"></i>${cur.y-1} ${cur.s}</span>`:"");
  const labels=SEM[cur.s].map(([,m])=>m+"月");
  const max=Math.max(1,...now,...(prev||[]).filter(v=>v!=null));
  const step=niceStep(max/4), top=Math.ceil(max/step)*step;
  const W=Math.max(340,Math.min(800,$("chart").clientWidth||800)),H=W<500?260:300,L=W<500?58:70,R=W-10,T=20,B=H-50,y=v=>B-(v/top)*(B-T);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="月ごとの売上">`;
  for(let v=0;v<=top;v+=step)s+=`<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="${v?"#E3E6EB":"#999"}"/><text x="${L-8}" y="${y(v)+4}" font-size="12" fill="#555" text-anchor="end">${v.toLocaleString()}</text>`;
  const gw=(R-L)/4, bw=Math.min(prev?44:64,gw*(prev?.36:.5));
  labels.forEach((lab,i)=>{
    const c=L+gw*(i+.5);
    if(prev&&prev[i]!=null)s+=`<rect x="${c-bw-4}" y="${y(prev[i])}" width="${bw}" height="${B-y(prev[i])}" fill="#8FB0DA"/>`;
    if(now[i]!=null)s+=`<rect x="${prev?c+4:c-bw/2}" y="${y(now[i])}" width="${bw}" height="${B-y(now[i])}" fill="#1A5CA8"/>`;
    s+=`<text x="${c}" y="${B+22}" font-size="13" fill="#444" text-anchor="middle">${lab}</text>`;
  });
  $("chart").innerHTML=s+"</svg>";
}
addEventListener("resize",()=>D&&draw());
function niceStep(x){const p=10**Math.floor(Math.log10(x)),n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
</script>
</body></html>
