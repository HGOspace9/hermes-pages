 const u=Math.abs(a)?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);const v=new THREE.Vector3().crossVectors(n,u);
 const o=new THREE.Vector3(x+a*h,y+b*h,z+c*h);
 return [o.clone().addScaledVector(u,-h).addScaledVector(v,-h),o.clone().addScaledVector(u,h).addScaledVector(v,-h),
         o.clone().addScaledVector(u,h).addScaledVector(v,h),o.clone().addScaledVector(u,-h).addScaledVector(v,h)];}
const buf=MATS.map(()=>({p:[],n:[],c:[]}));
const hash=(x,y,z)=>{let h=(x*73856093)^(y*19349663)^(z*83492791);return ((h>>>0)%1000)/1000;};
for(const [x,y,z,ci,m] of CUBES){
 const col=tint(ci,m).multiplyScalar(.96+.08*hash(x,y,z)); // tiny per-block variation = panel look
 for(const d of DIRS){if(occ.has((x+d[0])+','+(y+d[1])+','+(z+d[2])))continue;
  const q=faceQuad(x,y,z,d);const B=buf[m];
  // ensure CCW w.r.t. normal
  const e1=q[1].clone().sub(q[0]),e2=q[2].clone().sub(q[0]);const ok=e1.cross(e2).dot(new THREE.Vector3(...d))>0;
  /* voxel ambient occlusion per corner */
  const ao=q.map(P=>{const s=[P.x-x,P.y-y,P.z-z].map(v=>Math.sign(v));let side=[],o=[x+d[0],y+d[1],z+d[2]];
   for(let k=0;k<3;k++){if(d[k])continue;const t=[...o];t[k]+=s[k];side.push(occ.has(t.join(','))?1:0);}
   const cn=[...o];for(let k=0;k<3;k++)if(!d[k])cn[k]+=s[k];const c3=occ.has(cn.join(','))?1:0;
   const v=(side[0]&&side[1])?3:side[0]+side[1]+c3;return 1-v*.17;});
  const sh=d[1]<0?.55:1;
  const idx=ok?[0,1,2,0,2,3]:[0,2,1,0,3,2];
  for(const i of idx){B.p.push(q[i].x,q[i].y,q[i].z);B.n.push(...d);const a=ao[i]*sh;B.c.push(col.r*a,col.g*a,col.b*a);}}}
function mk(B,mat){if(!B.p.length)return;const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(B.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(B.n,3));
 g.setAttribute('color',new THREE.Float32BufferAttribute(B.c,3));const me=new THREE.Mesh(g,mat);me.castShadow=me.receiveShadow=true;root.add(me);}
buf.forEach((B,i)=>mk(B,MATS[i]));
// special shapes (slopes, diagonal beams, poles)
function tri(pts){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts.flat(),3));g.computeVertexNormals();return g;}
function prism(poly,z0,z1){const P=[],n=poly.length;
 for(let i=1;i<n-1;i++){P.push([poly[0][0],poly[0][1],z1],[poly[i][0],poly[i][1],z1],[poly[i+1][0],poly[i+1][1],z1]);P.push([poly[0][0],poly[0][1],z0],[poly[i+1][0],poly[i+1][1],z0],[poly[i][0],poly[i][1],z0]);}
 for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];P.push([a[0],a[1],z0],[b[0],b[1],z0],[b[0],b[1],z1],[a[0],a[1],z0],[b[0],b[1],z1],[a[0],a[1],z1]);}return tri(P);}
function downSlope(L){const z0=-.5,z1=L-.5,y0=-.5,y1=.5,P=[];const q=[[z0,y0],[z1,y0],[z0,y1]];
 for(const x of [-.5,.5]){const t=q.map(p=>[x,p[1],p[0]]);P.push(...(x>0?t:[t[0],t[2],t[1]]));}
 const e=(a,b)=>{P.push([-.5,a[1],a[0]],[.5,a[1],a[0]],[.5,b[1],b[0]],[-.5,a[1],a[0]],[.5,b[1],b[0]],[-.5,b[1],b[0]]);};
 e(q[0],q[1]);e(q[1],q[2]);e(q[2],q[0]);return tri(P);}
const GC={};const G=(s,L)=>GC[s+'_'+L]||(GC[s+'_'+L]=s==1?downSlope(L):s==2?prism([[-.5,-.5],[.5,-.5],[.5,.5]],-.5,L-.5):s==3?prism([[-.5,-.5],[.5,-.5],[-.5,.5]],-.5,L-.5):new THREE.CylinderGeometry(.42,.42,L,16).rotateX(Math.PI/2).translate(0,0,(L-1)/2));
const SG={};for(const s of SPECIAL){const k=s[3]+'_'+s[4]+'_'+s[12];(SG[k]=SG[k]||[]).push(s);}
const M4=new THREE.Matrix4(),F=new THREE.Vector3(),U=new THREE.Vector3(),R=new THREE.Vector3();
for(const k in SG){const arr=SG[k],m=arr[0][12];const mat=MATS[m].clone();mat.side=THREE.DoubleSide;
 const im=new THREE.InstancedMesh(G(arr[0][3],arr[0][4]),mat,arr.length);im.castShadow=im.receiveShadow=true;
 arr.forEach((s,i)=>{F.set(s[5],s[6],s[7]);U.set(s[8],s[9],s[10]);R.crossVectors(U,F);M4.makeBasis(R,U,F);M4.setPosition(s[0],s[1],s[2]);im.setMatrixAt(i,M4);
  im.setColorAt(i,tint(s[11],m).multiplyScalar(.96+.08*hash(s[0],s[1],s[2])));});
 root.add(im);}
// ---------- wheels: tyre + rim + hub as real cylinders
{const tyre=new THREE.MeshStandardMaterial({color:'#18191b',roughness:.85});const rimM=new THREE.MeshStandardMaterial({color:'#8a9099',roughness:.3,metalness:.9});
 const hubM=new THREE.MeshStandardMaterial({color:'#2b2e33',roughness:.4,metalness:.8});
 for(const [x,y,z,ax,D,Wd] of WHEELS){const g=new THREE.Group();const R=D/2*.98;
  const t=new THREE.Mesh(new THREE.CylinderGeometry(R,R,Wd*.92,40,1),tyre);
  const tr=new THREE.Mesh(new THREE.TorusGeometry(R*.88,R*.14,10,40),tyre);tr.rotation.x=Math.PI/2;tr.scale.z=Wd*2.2;
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(R*.62,R*.62,Wd*.96,32),rimM);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(R*.22,R*.22,Wd*1.02,16),hubM);
  g.add(t,rim,hub);for(let i=0;i<6;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(R*.08,Wd*.99,R*.5),hubM);b.rotation.y=i*Math.PI/3;b.position.set(Math.sin(i*Math.PI/3)*R*.32,0,Math.cos(i*Math.PI/3)*R*.32);g.add(b);}
  g.traverse(o=>{o.castShadow=o.receiveShadow=true;});
  if(ax==0)g.rotation.z=Math.PI/2;else if(ax==2)g.rotation.x=Math.PI/2;g.position.set(x,y,z);root.add(g);}}
// ---------- floor (glossy dark disc that fades out) + lights
const span=Math.max(INFO.size[0],INFO.size[2]);
{const cv=document.createElement('canvas');cv.width=cv.height=256;const g=cv.getContext('2d');const gr=g.createRadialGradient(128,128,0,128,128,128);
 gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.55,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);
 const fl=new THREE.Mesh(new THREE.CircleGeometry(span*1.6,96),new THREE.MeshStandardMaterial({color:'#20252e',roughness:.75,metalness:0,transparent:true,alphaMap:new THREE.CanvasTexture(cv),envMapIntensity:.15}));
 fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
 /* soft contact shadow blob under the vehicle */
 const c2=document.createElement('canvas');c2.width=c2.height=128;const g2=c2.getContext('2d');const r2=g2.createRadialGradient(64,64,0,64,64,64);
 r2.addColorStop(0,'rgba(0,0,0,.75)');r2.addColorStop(1,'rgba(0,0,0,0)');g2.fillStyle=r2;g2.fillRect(0,0,128,128);
 const bl=new THREE.Mesh(new THREE.PlaneGeometry(INFO.size[0]*1.5,INFO.size[2]*1.25),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c2),transparent:true,depthWrite:false}));
 bl.rotation.x=-Math.PI/2;bl.position.y=.01;scene.add(bl);}
scene.add(new THREE.HemisphereLight('#cfd8e6','#1a1d22',.35));
const key=new THREE.DirectionalLight('#fff4e6',2.4);key.position.set(span*.9,span*1.4,span*.7);key.castShadow=true;
key.shadow.mapSize.set(4096,4096);const sc=key.shadow.camera;sc.left=sc.bottom=-span;sc.right=sc.top=span;sc.near=1;sc.far=span*5;key.shadow.radius=4;key.shadow.bias=-.0004;key.shadow.normalBias=.02;scene.add(key);
const rim=new THREE.DirectionalLight('#9fc4ff',1.6);rim.position.set(-span,span*.6,-span*1.1);scene.add(rim);
// ---------- camera + turntable
const cam=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,span*20);window.cam=cam;
const H=INFO.size[1];cam.position.set(span*1.25,H*1.1+span*.25,span*1.35);
const ctl=new OrbitControls(cam,ren.domElement);ctl.target.set(0,H*.38,0);ctl.enableDamping=true;ctl.enablePan=false;
ctl.minDistance=span*.6;ctl.maxDistance=span*4;ctl.maxPolarAngle=Math.PI*.49;ctl.autoRotate=!location.search.includes('still');ctl.autoRotateSpeed=.6;
ctl.addEventListener('start',()=>{ctl.autoRotate=false;});ctl.update();window.ctl=ctl;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
const VIEWS={q:[1.25,.9,1.35],f:[0,.35,2.1],s:[2.1,.3,0],r:[-.4,.5,-2],t:[.01,2.4,.3]};let tgt=null;
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v=='spin'){ctl.autoRotate=!ctl.autoRotate;return;}
 ctl.autoRotate=false;const k=VIEWS[v];tgt=new THREE.Vector3(k[0]*span,H*.38+k[1]*span,k[2]*span);});
(function loop(){requestAnimationFrame(loop);if(tgt){cam.position.lerp(tgt,.08);if(cam.position.distanceTo(tgt)<.05)tgt=null;}ctl.update();ren.render(scene,cam);})();
