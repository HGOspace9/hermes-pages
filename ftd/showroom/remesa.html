function tri(pts){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts.flat(),3));g.computeVertexNormals();return g;}
function prism(poly,z0,z1){const P=[],n=poly.length;

function downSlope(L){const z0=-.5,z1=L-.5,y0=-.5,y1=.5,P=[];const q=[[z0,y0],[z1,y0],[z0,y1]];

 e(q[0],q[1]);e(q[1],q[2]);e(q[2],q[0]);return tri(P);}

// ---------- wheels: tyre + rim + hub as real cylinders
{const tyre=new THREE.MeshStandardMaterial({color:'#18191b',roughness:.85});const rimM=new THREE.MeshStandardMaterial({color:'#8a9099',roughness:.3,metalness:.9});

{const cv=document.createElement('canvas');cv.width=cv.height=256;const g=cv.getContext('2d');const gr=g.createRadialGradient(128,128,0,128,128,128);
