 const pm=document.getElementById('pm').checked;const hc=document.getElementById('chg').checked&&!pm,hw=document.getElementById('wk').checked;comM.visible=document.getElementById('cm').checked;
 shown=DATA.filter(d=>vis[d[3]]&&d[0]<=cx&&d[1]<=cy&&d[2]<=cz&&(part=='all'||(part=='tur')==!!d[4]));
 swG.visible=document.getElementById('sw').checked&&part!='tur';
 const groups={};shown.forEach(d=>{const k=d[7]+'_'+d[8];(groups[k]=groups[k]||[]).push(d);});
 const m=new THREE.Matrix4(),c=new THREE.Color(),F=new THREE.Vector3(),U=new THREE.Vector3(),R=new THREE.Vector3();
 for(const k in groups){const arr=groups[k];const mesh=new THREE.InstancedMesh(G(arr[0][7],arr[0][8]),new THREE.MeshLambertMaterial({side:THREE.DoubleSide}),arr.length);
  arr.forEach((d,i)=>{F.set(d[9],d[10],d[11]);U.set(d[12],d[13],d[14]);R.crossVectors(U,F);m.makeBasis(R,U,F);m.setPosition(d[0],d[1],d[2]);mesh.setMatrixAt(i,m);
   c.set((d[6]&4)?'#ff8800':hw&&(d[6]&2)?'#ff0000':hc&&(d[6]&1)?'#00ffff':pm?(ST.pal[d[15]]||'#808080'):CATS[d[3]][1]);mesh.setColorAt(i,c);});
  mesh.userData.arr=arr;root.add(mesh);meshes.push(mesh);}
}
const box=document.getElementById('cats');
CATS.forEach((c,i)=>{const n=DATA.filter(d=>d[3]==i).length;if(!n)return;const l=document.createElement('label');

 for(const d of T){lv[d[1]]=Math.max(lv[d[1]]||0,...[[-.5,-.5],[-.5,.5],[.5,-.5],[.5,.5]].map(([a,b])=>Math.hypot(d[0]+a-ST.tc[0],d[2]+b-ST.tc[2])));}
 for(const y in lv){const m=new THREE.Mesh(new THREE.CylinderGeometry(lv[y],lv[y],.98,48,1,true),new THREE.MeshBasicMaterial({color:0xffdc00,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false}));m.position.set(ST.tc[0],+y,ST.tc[2]);swG.add(m);}}
document.getElementById('clashmsg').innerHTML=ST.clash?`<b style="color:#ff8800">⚠ 砲塔にぶつかる車体ブロック ${ST.clash}個（オレンジ）</b>`:'<span style="color:#7f7">✓ 砲塔にぶつかる車体ブロックなし</span>';
document.querySelectorAll('input[name=part]').forEach(e=>e.onchange=build);
{const b=document.getElementById('cats');const l=document.createElement('label');l.innerHTML='<input type=checkbox id=pm> <b>ゲームの塗装の色で見る</b><br>';b.parentNode.insertBefore(l,b);if(location.hash=='#paint'||location.search.includes('paint')){document.getElementById('pm').checked=true;['sw','cm','chg'].forEach(i=>document.getElementById(i).checked=false);cam.position.set(26,10,30);}}
['cx','cy','cz','sw','chg','wk','cm','pm'].forEach(id=>document.getElementById(id).oninput=build);build();
const ray=new THREE.Raycaster(),mp=new THREE.Vector2(),tip=document.getElementById('tip');
addEventListener('mousemove',e=>{mp.x=e.clientX/innerWidth*2-1;mp.y=-e.clientY/innerHeight*2+1;ray.setFromCamera(mp,cam);
 const h=ray.intersectObjects(meshes)[0];if(h){const d=h.object.userData.arr[h.instanceId];tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';
 tip.textContent=`${NAMES[d[5]]}  (${d[0]},${d[1]},${d[2]})${d[4]?' 砲塔':' 車体'}${d[6]&4?' ⚠砲塔にぶつかる':''}${d[6]&1?' ★変更':''}${d[6]&2?' ⚠弱点':''}`;}else tip.style.display='none';});
