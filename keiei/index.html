["固定費を削減・効率化する方法を3つ挙げ、それぞれ例を示しなさい。","①安く調達する：相見積もり・値引き交渉・中古品購入 ②変動費化する（自分で持たない）：車や家具のリース、本社を賃貸、正社員の代わりにパート・派遣 ③回転率を上げる：24時間365日営業、空きスペースの外貸し、宴会場を朝食会場に、多能工化",["安く調達","変動費化（リース・派遣）","回転率向上（24時間・多目的）","それぞれに例がある"]],
["ブランド・マネジメントとは何か。ズレを補正する具体策を含めて説明しなさい。","企業が狙うブランド・アイデンティティと消費者が抱くブランド・イメージのズレを補正すること。①望まないイメージならコミュニケーション戦略やロゴ変更 ②知られていないならWEB・雑誌・TVでの訴求（誰を起用するか） ③商品自体（品質・機能・価格）の見直し。",["アイデンティティとイメージのズレ","ロゴ・コミュニケーション","メディア訴求","商品の見直し"]],
["ビジネスシステムの演習：駅前の居酒屋（中高年向け・パート5人・家賃高い・朝の稼働率が低い）の改善ポイントを、コストの考え方を使って提案しなさい。","（例）家賃という固定費の回転率を上げるため、朝・昼にも営業（モーニング・ランチ営業や24時間化）して稼働率を上げる。客単価を上げるメニュー設計。人手はパートの多能工化（ホール/キッチン兼任）とマニュアル化で少人数でも回し、辞めにくい働き方（シフトの柔軟化）にする。空き時間はスペースを外貸しする。",["固定費（家賃）の回転率向上","朝の活用・営業時間拡大","人の多能工化・マニュアル化","客単価への言及"]],
];
const $=s=>document.getElementById(s);let LS=JSON.parse(localStorage.keiei||"{}");const save=()=>localStorage.keiei=JSON.stringify(LS);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const back='<button onclick="home()">← ホーム</button>';
function home(){let h='<h1>企業経営 ミニテスト対策</h1><div class="tiles">';
for(const k in R){const n=C.filter(c=>c[0]==k),d=n.filter(c=>LS[c[1]]).length;
h+=`<div class="tile" onclick="cards('${k}')"><b>📇 ${R[k]}</b><small>暗記カード ${n.length}枚 ／ 覚えた ${d}</small><div class="bar"><i style="width:${d/n.length*100}%"></i></div></div>`}
h+=`<div class="tile" onclick="cards('all')"><b>📇 全部まとめて</b><small>${C.length}枚（シャッフル）</small></div>`;
h+=`<div class="tile" onclick="mock()"><b>📝 模擬ミニテスト（4択）</b><small>${M.length}問から15問をランダム出題・自動採点${LS._best!=null?' ／ 最高 '+LS._best+'点':''}</small></div>`;
h+=`<div class="tile" onclick="kijutsu(0)"><b>✍️ 記述問題</b><small>${K.length}問。書いて→模範解答とチェック項目で自己採点</small></div>`;
h+='<button onclick="if(confirm(\'記録を消しますか？\')){LS={};save();home()}">記録リセット</button></div>';$('app').innerHTML=h;scrollTo(0,0)}
let D=[],i=0,ng=[];
function cards(k,only){D=C.filter(c=>k=='all'||c[0]==k);if(only)D=D.filter(c=>!LS[c[1]]);D=k=='all'?shuf(D):D;i=0;ng=[];window._k=k;show()}
function show(rev){if(i>=D.length){$('app').innerHTML=`${back}<div class="card"><div class="big">おわり</div>まだ：${ng.length}枚</div><div class="row"><button class="p" onclick="cards(_k,1)">まだの分だけ復習</button><button onclick="cards(_k)">最初から</button></div>`;return}
const c=D[i];$('app').innerHTML=`<div class="top">${back}<span>${i+1}/${D.length}</span></div><div class="card" onclick="show(1)"><span class="tag">${R[c[0]]}</span><br>${c[1]}${rev?`<div class="ans">${c[2]}</div>`:'<div style="color:#999;font-size:14px;margin-top:20px">タップで答え</div>'}</div>`+(rev?`<div class="row"><button class="ng" onclick="mk(0)">✕ まだ</button><button class="ok" onclick="mk(1)">○ 覚えた</button></div>`:'')}
function mk(o){const c=D[i];if(o)LS[c[1]]=1;else{delete LS[c[1]];ng.push(c)}save();i++;show()}
let T=[];
function mock(){T=shuf(M).slice(0,15).map(q=>{const o=shuf(q[2].map((t,j)=>[t,j==q[3]]));return{q,o}});
let h=`${back}<h1>模擬ミニテスト</h1>`;T.forEach((t,n)=>{h+=`<div class="q"><span class="tag">${R[t.q[0]]}</span> <b>Q${n+1}. ${t.q[1]}</b>`+t.o.map((o,j)=>`<label id="l${n}_${j}"><input type="radio" name="q${n}" value="${j}"> ${o[0]}</label>`).join('')+`<div class="ex" id="e${n}">💡 ${t.q[4]}</div></div>`});
h+='<button class="p" style="width:100%" onclick="grade()">採点する</button><div id="res"></div>';$('app').innerHTML=h;scrollTo(0,0)}
function grade(){let s=0;T.forEach((t,n)=>{const v=document.querySelector(`input[name=q${n}]:checked`);t.o.forEach((o,j)=>{if(o[1])$(`l${n}_${j}`).className='right'});
if(v&&t.o[v.value][1])s++;else if(v)$(`l${n}_${v.value}`).className='wrong';$('e'+n).style.display='block'});
const p=Math.round(s/T.length*100);if(LS._best==null||p>LS._best)LS._best=p;save();
$('res').innerHTML=`<div class="card"><div class="big">${s} / ${T.length}（${p}点）</div>間違えた問題は上の解説を確認してください。</div><button class="p" onclick="mock()">もう一度（別の問題）</button>`;$('res').scrollIntoView()}
function kijutsu(n){if(n>=K.length){home();return}const k=K[n];
$('app').innerHTML=`<div class="top">${back}<span>${n+1}/${K.length}</span></div><div class="q"><b>${k[0]}</b><textarea id="ta" placeholder="ここに書く（メモでOK）"></textarea><button class="p" onclick="kAns(${n})">模範解答を見る</button><div id="ka"></div></div>`}
function kAns(n){const k=K[n];$('ka').innerHTML=`<div class="ans">${k[1]}</div><p><b>チェック（書けたものに✓）</b></p>`+k[2].map((c,j)=>`<label><input type="checkbox" onchange="kc(${n})" class="kc"> ${c}</label>`).join('')+`<p id="ks"></p><button onclick="kijutsu(${n+1})">次の問題 →</button>`}
function kc(n){const a=[...document.querySelectorAll('.kc')];$('ks').textContent=`${a.filter(x=>x.checked).length} / ${a.length} 点`}
home();
</script></body></html>
