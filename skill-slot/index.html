<script>
// 昔のゲーム風の背景：160x120の粗い画面に描いて、ぼかさず引き伸ばす（ドットが見える）
// 夜空：背景は止めたまま、星がたまにチカチカ、ときどき流れ星
(()=>{const W=160,H=120,c=document.getElementById('bg'),x=c.getContext('2d');
const base=document.createElement('canvas');base.width=W;base.height=H;const bx=base.getContext('2d');
const img=bx.createImageData(W,H),d=img.data;
// 背景の色案（?bg=1〜4 で切替）
const PAL={1:{r:1,s:[[0,[24,48,136]],[.5,[8,24,80]],[1,[0,4,24]]]},          // 中央だけ明るい紺（スポットライト）
 2:{s:[[0,[4,4,24]],[.45,[16,12,60]],[.7,[36,22,84]],[.85,[24,14,58]],[1,[4,4,20]]]},        // 紺→紫→夕焼けピンク（夕暮れ・暗め）
 3:{s:[[0,[0,4,20]],[.65,[8,16,56]],[.88,[40,48,96]],[1,[184,112,72]]]},       // 夜明け前：地平線だけオレンジ
 4:{s:[[0,[0,0,8]],[.7,[0,8,24]],[1,[0,64,72]]]}};                             // ほぼ黒の宇宙＋下に青緑の光
const P=PAL[new URLSearchParams(location.search).get('bg')]||PAL[2];const stops=P.s;
const bayer=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5]; // 4x4のディザ（網目状の色の混ぜ方）
const STEP=16; // 色数をかなり減らす（段差がはっきり出る）
for(let y=0;y<H;y++){let i=0;
 for(let xx=0;xx<W;xx++){const t=P.r?Math.min(1,Math.hypot((xx-W/2)/(W*.55),(y-H*.5)/(H*.6))):y/(H-1);i=0;while(t>stops[i+1][0])i++;
  const [a0,ca]=stops[i],[b0,cb]=stops[i+1],k=(t-a0)/(b0-a0),th=(bayer[(y&3)*4+(xx&3)]/16-.5)*STEP,o=(y*W+xx)*4;
  for(let j=0;j<3;j++){const v=ca[j]+(cb[j]-ca[j])*k+th;d[o+j]=Math.max(0,Math.min(255,Math.round(v/STEP)*STEP));}d[o+3]=255;}}
bx.putImageData(img,0,0);
let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let n=0;n<4;n++){bx.fillStyle='rgba(48,64,160,.25)';const gx=r()*W|0,gy=r()*90|0;bx.fillRect(gx-1,gy,3,1);bx.fillRect(gx,gy-1,1,3);}
// 星：ふだんは静か。ときどき1つずつチカッと明るくなる
const stars=[];for(let n=0;n<70;n++)stars.push({x:r()*W|0,y:r()*110|0,b:r()<.2?2:r()<.5?1:0,tw:0});
const COL=['#28306c','#4840a0','#8888c8','#d8d8ff'];
let shoot=null,nextShoot=performance.now()+2500,last=0;const extra=[];
window.meteorShower=(n,c1,c2)=>{for(let i=0;i<n;i++)extra.push({x:60+Math.random()*130,y:-10+Math.random()*40,life:0,sp:2.5+Math.random()*2,delay:Math.floor(Math.random()*n*1.5),c1,c2});};
function frame(now){requestAnimationFrame(frame);
 if(now-last<50)return;last=now; // 約20コマ/秒（昔っぽいカクつき）
 x.drawImage(base,0,0);
 for(const st of stars){
  if(st.tw<=0&&Math.random()<.004)st.tw=1; // たまにチカチカ開始
  let lv=st.b;
  if(st.tw>0){lv=Math.min(3,st.b+(st.tw<.5?1:2));st.tw-=.12;
   if(lv>=3){x.fillStyle='#6060b0';x.fillRect(st.x-1,st.y,3,1);x.fillRect(st.x,st.y-1,1,3);}} // 十字に光る
  x.fillStyle=COL[lv];x.fillRect(st.x,st.y,1,1);}
 // 流れ星：数秒〜十数秒に1本、右上から左下へ
 if(!shoot&&now>nextShoot)shoot={x:40+Math.random()*120,y:Math.random()*35,len:0,life:0};
 // お祝いの流れ星（当たりのときだけ。色つき・たくさん）
 for(let i=extra.length-1;i>=0;i--){const s=extra[i];if(s.delay>0){s.delay--;continue;}s.life++;
  const hx=s.x-s.life*s.sp,hy=s.y+s.life*s.sp*.53;
  for(let k=0;k<14;k++){const px=Math.round(hx+k*s.sp*.55),py=Math.round(hy-k*s.sp*.53*.55);
   x.fillStyle=k===0?'#ffffff':k<4?s.c1:k<9?s.c2:'#303880';x.fillRect(px,py,1,1);}
  if(hx<-20||hy>H+5)extra.splice(i,1);}
 if(shoot){const s=shoot;s.life++;
  const hx=s.x-s.life*3,hy=s.y+s.life*1.6;
  for(let k=0;k<12;k++){const px=Math.round(hx+k*3*.55),py=Math.round(hy-k*1.6*.55);
   x.fillStyle=k===0?'#ffffff':k<4?'#b8c0ff':k<8?'#6070d0':'#303880';x.fillRect(px,py,1,1);}
  if(hx<-10||hy>H||s.life>45){shoot=null;nextShoot=now+4000+Math.random()*9000;}}
}
requestAnimationFrame(frame);})();
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.domElement.className='gl';
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
// 背景は後ろのDS風キャンバス（透明にして見せる）
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,100);
camera.position.set(3.2,2.2,6.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.6,0);controls.enableDamping=true;controls.enablePan=false;
controls.minDistance=4;controls.maxDistance=12;

// 光：ポリゴンの面が見えるように強めの方向光
scene.add(new THREE.HemisphereLight(0x9fb8ff,0x1a2050,1.5));
const key=new THREE.DirectionalLight(0xffffff,3.3);key.position.set(4,6,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x8fa8ff,2.0);rim.position.set(-5,3,-4);scene.add(rim);

// 濃い青の色バリエーション（文字・絵なし、濃淡だけ）
const M=c=>new THREE.MeshStandardMaterial({color:c,flatShading:true,metalness:0.35,roughness:0.45});
const body=M(0x123a9c), dark=M(0x0a1f5c), deep=M(0x061238), light=M(0x2a5fd6), reelM=M(0x7f9fe8);

const slot=new THREE.Group();scene.add(slot);
const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);slot.add(m);return m;};

const W=2,D=1.5,H=2.2; // 本体
// 本体：正面の形（四角＋上がアーチ）を奥へ押し出す
const prof=(sc=1)=>{const sh=new THREE.Shape();const w=W/2*sc;
  sh.moveTo(-w,0.2);sh.lineTo(w,0.2);sh.lineTo(w,H+0.5);sh.lineTo(-w,H+0.5);sh.lineTo(-w,0.2);return sh;};
const ext=(sh,d,curve=10)=>new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false,curveSegments:curve});
add(ext(prof(1),D*0.55),body,0,0,-D*0.55+D/2);          // 前半分：青
add(ext(prof(1.03),D*0.5),dark,0,-0.03,-D/2);            // 後ろ半分：濃い色（写真の黒い部分）
// 前面：上の飾り板（アーチ内）

// 小さな横長パネル（写真の数字パネルの位置、無地）
add(new THREE.BoxGeometry(1.6,0.24,0.08),dark,0,H+0.33,D/2+0.03);

// リール窓：くぼみ
const winY=1.875;
add(new THREE.BoxGeometry(1.7,0.9,0.1),deep,0,winY,D/2+0.0);
// 窓枠
add(new THREE.BoxGeometry(1.84,0.08,0.14),light,0,winY+0.49,D/2+0.03);
add(new THREE.BoxGeometry(1.84,0.08,0.14),light,0,winY-0.49,D/2+0.03);
for(const s of [-1,1]) add(new THREE.BoxGeometry(0.08,1.06,0.14),light,s*0.88,winY,D/2+0.03);
// リール3本：12枚の板を輪に。板には出目の宝石（ローポリ）。レア度は 赤>黄>紫>青>緑>グレー
// R=赤 王冠ルビー / Y=黄 星 / P=紫 ひし形結晶 / B=青 しずく / G=緑 六角形 / X=グレー 石ころ

// 平らな宝石：3Dの宝石の形と「面の向き（光の当たり方）」はそのまま、奥行きだけつぶす → キラキラは残り、飛び出さない

    if(p0<0.3&&pullT>=0.3)clack(70,.12,.4); // スペース/Enterでも、下まで引いたところで「ガシャッ」（ドラッグと同じ音）
    if(pullT>0.8){pullT=-1;lq=0;clack(140,.05,.15);}} // 上に戻ったところで「カチッ」
  else if(drag){ // 手より遅れて重くついてくる
    if(locked){lq=1;if(drag.t<.85){locked=false;}}
    else{lq+=(drag.t-lq)*Math.min(1,dt*20);
      if(lq>=.97){locked=true;lq=1;clack(70,.12,.4); // ガチッ（下で止まる）
        if(!drag.fired)drag.fired=pull(false);}}
    if(lq<=.3)drag.fired=false; // 持ったまま上に戻したら、もう一度引ける
    lv=0;lever.rotation.x=lq*LMAX;}
  else if(lq>0||lv!==0){ // 離したら重いバネで戻り、上で少し跳ねる
    lv+=(-lq*90-lv*9)*dt;lq+=lv*dt;
    if(lq<0){if(Math.abs(lv)>.6)clack(140,.05,.15);lq=0;lv=-lv*.25;if(Math.abs(lv)<.05)lv=0;}
    lever.rotation.x=lq*LMAX;}
  reels.forEach((g,i)=>{const s=st[i];if(s.done)return;
    if(!s.stopping){g.rotation.x-=s.v*dt;
      if(now>=s.stopAt){s.stopping=true;s.t0=now;s.from=g.rotation.x;{const base=Math.floor(s.from/STEP)-3,t=outcome.targets[i];s.fin=(base-(((base-t)%SEG)+SEG)%SEG)*STEP;}/* 抽選した色の板で止める */}}
    else{const k=Math.min(1,(now-s.t0)/0.5);g.rotation.x=s.from+(s.fin-s.from)*easeBack(k);
      if(k>=1){s.done=true;clack(200,.04,.12);s.result=LAYOUT[((Math.round(s.fin/STEP)%SEG)+SEG)%SEG];}}});
  if(spinning&&st.every(s=>s.done)){spinning=false;window.lastResult=st.map(s=>s.result); // 出目（0〜11）。結果カードは次のラウンドで
    dispatchEvent(new CustomEvent('slotresult',{detail:window.lastResult}));celebrate(outcome.tier,window.lastResult);if(outcome.tier==='miss'){window.lastCard={tier:'miss',name:null};missMsg();}else setTimeout(()=>showCard(outcome.tier),350+(CEL[outcome.tier].lv>=4?500:0));}
  celeStep(now);camK+=(camGoal-camK)*Math.min(1,dt*3.5);applyShift();controls.update();renderer.render(scene,camera);}
// 画面の形に合わせて見え方を変える。ふだんはスロットが真ん中。
// カードが出たときだけカメラを横（スマホは上）へずらし、カードを閉じる/もう一回引くと真ん中へ戻る
let camK=0,camGoal=0;
function applyShift(){const w=innerWidth,h=innerHeight,k=camK*camK*(3-2*camK);
  if(k<0.001){camera.clearViewOffset();return;}
  if(w/h>=1&&w>=820)camera.setViewOffset(w,h,w*(h<=520?0.2:0.14)*k,0,w,h);   // 横長：スロットを左へ、右にカード
  else camera.setViewOffset(w,h,0,h*0.2*k,w,h);                // 縦長：スロットを上へ、下にカード
}
function fitView(){const asp=innerWidth/innerHeight;camera.aspect=asp;
  camera.fov=asp<1?35+(1-asp)*38:35;controls.target.set(0,1.6,0);
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);applyShift();}
fitView();addEventListener('resize',fitView);
renderer.setAnimationLoop(animate);
</script>
<script>applyLang();/* 撮影テスト用：?shot でページを開くと自動で1回まわす */if(/[?&]shot/.test(location.search))addEventListener('load',()=>setTimeout(()=>window.pull&&pull(true),300));</script>
