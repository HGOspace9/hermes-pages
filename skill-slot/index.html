<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Slot</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0d1b3d}canvas{display:block;cursor:grab}canvas:active{cursor:grabbing}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1b3d); // 仮の背景（ラウンド3で差し替え）
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,100);
camera.position.set(3.2,2.2,6.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.6,0);controls.enableDamping=true;controls.enablePan=false;
controls.minDistance=4;controls.maxDistance=12;

// 光：ポリゴンの面が見えるように強めの方向光
scene.add(new THREE.HemisphereLight(0x9fb8ff,0x0a1030,0.9));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(4,6,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x6f8cff,1.0);rim.position.set(-5,3,-4);scene.add(rim);

// 濃い青の色バリエーション（文字・絵なし、濃淡だけ）
const M=c=>new THREE.MeshStandardMaterial({color:c,flatShading:true,metalness:0.35,roughness:0.45});
const body=M(0x123a9c), dark=M(0x0a1f5c), deep=M(0x061238), light=M(0x2a5fd6), reelM=M(0x7f9fe8);

const slot=new THREE.Group();scene.add(slot);
const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);slot.add(m);return m;};

const W=2,D=1.5,H=2.2; // 本体
// 本体：正面の形（四角＋上がアーチ）を奥へ押し出す
const prof=(sc=1)=>{const sh=new THREE.Shape();const w=W/2*sc;
  sh.moveTo(-w,0.2);sh.lineTo(w,0.2);sh.lineTo(w,H+0.2);sh.absarc(0,H+0.2,w,0,Math.PI,false);sh.lineTo(-w,0.2);return sh;};
const ext=(sh,d,curve=10)=>new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false,curveSegments:curve});
add(ext(prof(1),D*0.55),body,0,0,-D*0.55+D/2);          // 前半分：青
add(ext(prof(1.03),D*0.5),dark,0,-0.03,-D/2);            // 後ろ半分：濃い色（写真の黒い部分）
// 前面：上の飾り板（アーチ内）

// 小さな横長パネル（写真の数字パネルの位置、無地）
add(new THREE.BoxGeometry(1.6,0.28,0.08),dark,0,H+0.05,D/2+0.03);

// リール窓：くぼみ
const winY=1.75;
add(new THREE.BoxGeometry(1.7,0.9,0.1),deep,0,winY,D/2+0.0);
// 窓枠
add(new THREE.BoxGeometry(1.84,0.08,0.14),light,0,winY+0.49,D/2+0.03);
add(new THREE.BoxGeometry(1.84,0.08,0.14),light,0,winY-0.49,D/2+0.03);
for(const s of [-1,1]) add(new THREE.BoxGeometry(0.08,1.06,0.14),light,s*0.88,winY,D/2+0.03);
// リール3本（多角柱、無地）
const reels=[];
for(let i=-1;i<=1;i++){
  const r=add(new THREE.CylinderGeometry(0.42,0.42,0.48,12),reelM,i*0.55,winY,D/2-0.3,0,0,Math.PI/2);
  reels.push(r);
  if(i<1) add(new THREE.BoxGeometry(0.05,0.84,0.08),deep,i*0.55+0.275,winY,D/2+0.02);
}
// 窓の下の斜めの棚（写真の横縞の部分を形だけ）
add(new THREE.BoxGeometry(1.84,0.12,0.4),light,0,1.18,D/2+0.12,-0.5,0,0);
for(let k=0;k<3;k++) add(new THREE.BoxGeometry(1.7,0.04,0.06),dark,0,1.06-k*0.08,D/2+0.03);
// 下のパネル（無地）
add(new THREE.BoxGeometry(1.7,0.62,0.06),dark,0,0.6,D/2+0.02);
// 台座
add(new THREE.BoxGeometry(W+0.16,0.22,D+0.16),dark,0,0.11,0);
// コイン受け（前に出たトレイ）
add(new THREE.BoxGeometry(1.1,0.14,0.32),light,0,0.24,D/2+0.16);
add(new THREE.BoxGeometry(0.9,0.06,0.22),deep,0,0.3,D/2+0.17);

// レバー（右側面）
const lever=new THREE.Group();lever.position.set(W/2+0.12,1.3,0);slot.add(lever);
const lp=(geo,mat,x,y,z,rx=0,ry=0,rz=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);lever.add(m);return m;};
lp(new THREE.CylinderGeometry(0.22,0.22,0.16,8),dark,0.04,0,0,0,0,Math.PI/2); // 根元
lp(new THREE.BoxGeometry(0.14,0.5,0.14),deep,0.14,-0.05,0.12,0.4,0,0);       // 下のフック
lp(new THREE.CylinderGeometry(0.06,0.06,1.1,6),deep,0.16,0.55,0);             // 棒
lp(new THREE.DodecahedronGeometry(0.17,0),light,0.16,1.15,0);                 // 先の玉

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</body></html>
